<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <!-- 在桌面外壳里（只有 Electron 的 preload 会挂 galaxyShell）把画布底去掉，窗口形状才由面板自己的
         圆角决定。必须在样式生效前同步做完：等模块脚本跑起来再设，会闪一下方形的渐变底。 -->
    <script>
      if (window.galaxyShell) document.documentElement.dataset.shell = 'desktop';
    </script>
    <!-- 后端在哪。留空 = 同源。外壳(Electron / Tauri)按需改写这一行。 -->
    <meta name="galaxy-base" content="" />
    <!-- 演示数据。**生产必须是 off。**
         悄悄塞假数据的话,「有卡片」和「后端没接上」在界面上就分不开了 ——
         用户会以为记忆卡片已经接好了,其实那几张是写死的。
         本地看设计时临时改成 "on",别提交。 -->
    <meta name="galaxy-demo" content="off" />
    <!-- 图标内联成 data URI:壳里以 file:// 打开时没有同源后端可问,
         留 favicon.ico 就是一条恒定 404。定义处 core/brand_icon.py。 -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2040%2040%22%3E%3Cpath%20d%3D%22M20%204.6c8%200%2013.6%204.2%2015%2011%20.6%202.9.6%205.9%200%208.8-1.4%207.2-6.8%2011.6-15%2011.6S6.4%2031.6%205%2024.4a22%2022%200%200%201%200-8.8c1.4-6.8%207-11%2015-11z%22%20fill%3D%22%23a58bb5%22%2F%3E%3Crect%20x%3D%2213.2%22%20y%3D%2214.4%22%20width%3D%224%22%20height%3D%229.6%22%20rx%3D%222%22%20fill%3D%22%23fcf9fe%22%2F%3E%3Crect%20x%3D%2222.8%22%20y%3D%2214.4%22%20width%3D%224%22%20height%3D%229.6%22%20rx%3D%222%22%20fill%3D%22%23fcf9fe%22%2F%3E%3C%2Fsvg%3E" />
    <title>Galaxy</title>
    <script defer src="./assets/index-DCYtFRif.js"></script>
  </head>

    <div id="hud"></div>
  </body>
