<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxy V2 Desktop Presence</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- ============================================
         SPACE 空间层 — 在桌面背后，CSS 3D纵深
         ============================================ -->
    <div class="space" id="spaceLayer">
        <div class="space-plane">
            <div class="ceiling-line"></div>
            <div class="floor-line"></div>
        </div>
    </div>

    <!-- ============================================
         DESKTOP 桌面层 — 最前面，不动，半透明背景
         ============================================ -->
    <div class="desktop" id="desk">
        <div class="bg"></div>
    </div>

    <!-- ============================================
         LIMINAL 阈限态 — 蓝紫粉边缘光雾叠加
         ============================================ -->
    <div class="l" id="lLayer">
        <div class="l-wrap">
            <div class="l-glow"></div>
        </div>
        <div class="l-text">正在理解</div>
    </div>

    <!-- ============================================
         SILENT 静默态 — WebGL Shader有机波动
         ============================================ -->
    <div class="s on" id="sLayer">
        <div id="silent-canvas-container"></div>
        <div class="s-bezel"></div>
    </div>

    <!-- ============================================
         MANIFEST 显现态 — 极简空壳
         ============================================ -->
    <div class="m" id="mLayer"></div>

    <!-- ============================================
         WebSocket 状态指示器
         ============================================ -->
    <div id="ws-status" class="ws-disconnected">
        <div class="ws-dot"></div>
        <span id="ws-status-text">OFFLINE</span>
    </div>

    <!-- ============================================
         脚本加载
         
         Three.js 通过 electron/preload.js 本地加载
         （contextBridge.exposeInMainWorld('THREE', THREE)）
         无需 CDN，支持离线使用
         ============================================ -->
    <!-- 三态模块 -->
    <script src="silent-state.js"></script>
    <script src="liminal-state.js"></script>
    <script src="manifest-state.js"></script>

    <!-- 主应用 — 状态机 + WebSocket -->
    <script src="app.js"></script>
</body>
</html>
