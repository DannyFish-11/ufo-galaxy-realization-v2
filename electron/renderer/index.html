<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galaxy</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; }

body {
  /* 透明背景 — 桌面壁纸完全可见 */
  background: transparent;
  font-family: 'SF Pro Rounded', -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
}

/* Canvas 覆盖全屏 */
#overlay {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 9999;
}

/* 灵动岛 */
#island {
  position: fixed;
  top: 14px;
  left: 50%;
  z-index: 10001;
  height: 34px;
  padding: 0 18px;
  background: linear-gradient(180deg,
    rgba(178,142,67,0.22) 0%,
    rgba(212,175,55,0.14) 50%,
    rgba(178,142,67,0.08) 100%
  );
  backdrop-filter: blur(24px) saturate(1.3);
  -webkit-backdrop-filter: blur(24px) saturate(1.3);
  border: 0.5px solid rgba(255,248,240,0.1);
  border-radius: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  color: rgba(255,252,245,0.88);
  font-size: 13px;
  font-weight: 400;
  letter-spacing: 0.4px;
  box-shadow:
    0 4px 20px rgba(178,142,67,0.08),
    inset 0 0.5px 0 rgba(255,255,255,0.06);
  /* 初始状态：隐藏在上方 */
  transform: translateX(-50%) translateY(-60px) scale(0.85);
  opacity: 0;
  transition: transform 1.0s cubic-bezier(0.25, 0.1, 0.25, 1),
              opacity 0.7s ease-out;
  pointer-events: none;
}

#island.visible {
  transform: translateX(-50%) translateY(0) scale(1);
  opacity: 1;
}

#island .dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(232,210,175,1) 0%, rgba(178,142,67,0.5) 100%);
  box-shadow: 0 0 5px rgba(232,210,175,0.4);
}

/* 状态指示（开发模式，用户不可见） */
#depth {
  position: fixed;
  bottom: 14px;
  right: 18px;
  z-index: 10000;
  color: rgba(178,142,67,0.3);
  font-size: 11px;
  font-weight: 300;
  letter-spacing: 0.6px;
  pointer-events: none;
}

/* 状态点呼吸动画 */
@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(0.8); }
}
</style>
</head>
<body>

<!-- WebGL 渲染画布 -->
<canvas id="overlay"></canvas>

<!-- 灵动岛 -->
<div id="island">
  <div class="dot"></div>
  <span id="islandText">Galaxy</span>
</div>

<!-- 深度显示（开发模式） -->
<div id="depth">0.00</div>

<!-- 模块加载 -->
<script src="webgl/context.js"></script>
<script src="bridge/websocket.js"></script>
<script src="ui/island.js"></script>
<script src="app.js"></script>

</body>
</html>
