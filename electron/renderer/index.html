<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxy V2 Desktop Presence</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- ============================================
         桌面层 — 真实桌面始终可见
         ============================================ -->
    <div class="desktop" id="desk">
        <div class="bg"></div>
    </div>

    <!-- ============================================
         SILENT 静默态 — WebGL Shader有机波动
         ============================================ -->
    <div class="s on" id="sLayer">
        <!-- WebGL Canvas容器 -->
        <div id="silent-canvas-container"></div>
        <!-- CSS辅助：屏幕边缘氛围灯 -->
        <div class="s-bezel"></div>
    </div>

    <!-- ============================================
         LIMINAL 阈限态 — CSS 3D深度空间
         ============================================ -->
    <div class="l" id="lLayer">
        <div class="corridor">
            <div class="room">
                <div class="wall-floor"></div>
                <div class="wall-ceil"></div>
                <div class="wall-left"></div>
                <div class="wall-right"></div>
                <div class="vanish"></div>
            </div>
        </div>
        <div class="l-fog"></div>
        <div class="l-text">正在理解</div>
    </div>

    <!-- ============================================
         MANIFEST 显现态 — 极简空壳
         ============================================ -->
    <div class="m" id="mLayer"></div>

    <!-- ============================================
         WebSocket 状态指示器
         ============================================ -->
    <div id="ws-status" class="ws-disconnected">
        <div class="ws-dot"></div>
        <span id="ws-status-text">OFFLINE</span>
    </div>

    <!-- ============================================
         脚本加载
         ============================================ -->
    <!-- Three.js — Silent态WebGL Shader所需 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <!-- 三态模块 -->
    <script src="silent-state.js"></script>
    <script src="liminal-state.js"></script>
    <script src="manifest-state.js"></script>

    <!-- 主应用 — 状态机 + WebSocket -->
    <script src="app.js"></script>
</body>
</html>
