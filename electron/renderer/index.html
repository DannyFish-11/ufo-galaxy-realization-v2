<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxy V2 Desktop Presence</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- ============================================
         桌面层 (Liminal态下会被Three.js场景接管)
         ============================================ -->
    <div class="desktop" id="desk">
        <div class="bg"></div>
    </div>

    <!-- ============================================
         Three.js 3D 场景容器 (Liminal态使用)
         ============================================ -->
    <div id="three-container"></div>

    <!-- ============================================
         SILENT 静默态 — WebGL Shader有机波动
         ============================================ -->
    <div class="s" id="sLayer">
        <!-- WebGL Canvas会被动态注入到这里 -->
        <div id="silent-canvas-container"></div>
        <!-- CSS辅助：屏幕边缘氛围灯 -->
        <div class="s-bezel"></div>
    </div>

    <!-- ============================================
         LIMINAL 阈限态 — Three.js 3D透视 + 消失点光球
         ============================================ -->
    <div class="l" id="lLayer">
        <div class="l-haze"></div>
        <div class="vanish"></div>
        <div class="l-text">正在理解</div>
    </div>

    <!-- ============================================
         MANIFEST 显现态 — 极简空壳
         ============================================ -->
    <div class="m" id="mLayer"></div>

    <!-- ============================================
         WebSocket 状态指示器
         ============================================ -->
    <div id="ws-status" class="ws-disconnected">
        <div class="ws-dot"></div>
        <span id="ws-status-text">OFFLINE</span>
    </div>

    <!-- ============================================
         脚本加载
         ============================================ -->
    <!-- Three.js — 必须在各态模块之前加载 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <!-- 三态模块 -->
    <script src="silent-state.js"></script>
    <script src="liminal-state.js"></script>
    <script src="manifest-state.js"></script>
    
    <!-- 主应用 — 状态机 + WebSocket -->
    <script src="app.js"></script>
</body>
</html>
