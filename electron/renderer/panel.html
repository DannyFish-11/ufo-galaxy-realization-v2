<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UFO Galaxy Control Panel</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: rgba(10, 10, 15, 0.92);
            color: #e0e0e0;
            width: 100vw; height: 100vh;
            overflow: hidden;
            display: flex; flex-direction: column;
        }
        .panel-header {
            padding: 12px 20px;
            background: rgba(20, 20, 30, 0.95);
            border-bottom: 1px solid rgba(100, 200, 255, 0.2);
            display: flex; align-items: center; justify-content: space-between;
        }
        .panel-title { font-size: 14px; font-weight: 600; color: #64c8ff; letter-spacing: 2px; }
        .panel-status { font-size: 11px; color: #4caf50; }
        .panel-body {
            flex: 1; padding: 20px;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 16px;
        }
        .card {
            background: rgba(30, 30, 45, 0.8);
            border: 1px solid rgba(100, 200, 255, 0.1);
            border-radius: 8px;
            padding: 16px;
        }
        .card-title {
            font-size: 12px; font-weight: 600;
            color: #64c8ff; margin-bottom: 12px;
            text-transform: uppercase; letter-spacing: 1px;
        }
        .info-row {
            display: flex; justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 12px;
        }
        .info-label { color: #888; }
        .info-value { color: #ccc; font-family: monospace; }
        .phase-indicator {
            display: inline-block; padding: 2px 10px;
            border-radius: 4px; font-size: 11px;
            font-weight: 600; text-transform: uppercase;
        }
        .phase-silent { background: rgba(100,200,255,0.2); color: #64c8ff; }
        .phase-liminal { background: rgba(255,180,50,0.2); color: #ffb432; }
        .phase-manifest { background: rgba(50,255,100,0.2); color: #32ff64; }
    </style>
</head>
<body>
    <div class="panel-header">
        <span class="panel-title">UFO GALAXY // CONTROL PANEL</span>
        <span class="panel-status" id="connection-status">Connecting...</span>
    </div>
    <div class="panel-body">
        <div class="card">
            <div class="card-title">System Status</div>
            <div class="info-row">
                <span class="info-label">Phase</span>
                <span class="info-value"><span class="phase-indicator phase-silent" id="current-phase">SILENT</span></span>
            </div>
            <div class="info-row">
                <span class="info-label">Backend</span>
                <span class="info-value" id="backend-status">Connecting...</span>
            </div>
            <div class="info-row">
                <span class="info-label">WebSocket</span>
                <span class="info-value" id="ws-status-text">--</span>
            </div>
        </div>
        <div class="card">
            <div class="card-title">Model Routing</div>
            <div class="info-row"><span class="info-label">Local Brain</span><span class="info-value" id="local-brain">Gemma 4 E4B</span></div>
            <div class="info-row"><span class="info-label">API Brain</span><span class="info-value" id="api-brain">--</span></div>
            <div class="info-row"><span class="info-label">Active Route</span><span class="info-value" id="active-route">Local</span></div>
        </div>
        <div class="card">
            <div class="card-title">Hardware</div>
            <div class="info-row"><span class="info-label">GPU</span><span class="info-value" id="gpu-info">Detecting...</span></div>
            <div class="info-row"><span class="info-label">GPU Temp</span><span class="info-value" id="gpu-temp">-- C</span></div>
            <div class="info-row"><span class="info-label">VRAM</span><span class="info-value" id="vram-usage">-- / -- GB</span></div>
        </div>
        <div class="card">
            <div class="card-title">Connected Devices</div>
            <div class="info-row"><span class="info-label">Android</span><span class="info-value" id="android-device">Not connected</span></div>
            <div class="info-row"><span class="info-label">Mesh Nodes</span><span class="info-value" id="mesh-nodes">0</span></div>
            <div class="info-row"><span class="info-label">NATS</span><span class="info-value" id="nats-status">Offline</span></div>
        </div>
    </div>
    <script>
        // Connect to the same WebSocket as the three-state GUI
        const ws = new WebSocket('ws://localhost:16201/ws/desktop-presence');
        ws.onopen = () => {
            document.getElementById('connection-status').textContent = 'Connected';
            document.getElementById('connection-status').style.color = '#4caf50';
            ws.send(JSON.stringify({ type: 'register', client: 'control-panel', version: '1.0.0' }));
        };
        ws.onmessage = (event) => {
            const msg = JSON.parse(event.data);
            if (msg.type === 'phase_change' && msg.phase) {
                const el = document.getElementById('current-phase');
                el.textContent = msg.phase.toUpperCase();
                el.className = 'phase-indicator phase-' + msg.phase;
            }
            if (msg.type === 'status') {
                document.getElementById('backend-status').textContent = msg.status || 'Online';
            }
        };
        ws.onerror = () => {
            document.getElementById('connection-status').textContent = 'Error';
            document.getElementById('connection-status').style.color = '#ff5252';
        };
        ws.onclose = () => {
            document.getElementById('connection-status').textContent = 'Disconnected';
            document.getElementById('connection-status').style.color = '#ff9800';
        };
    </script>
</body>
</html>
