# Device-to-Node Resolution Map
# =============================
# PR-DEVICE-RESOLUTION: Maps AIP v3 device types / transports / capabilities
# to their canonical Node implementations.
#
# This is the single source of truth for "which Node implements which device".
# It is read by core/device_node_resolver.py at runtime.
#
# Three match paths (in priority order):
#   1. device_type — exact AIPDeviceType match
#   2. transport   — transport protocol match (ble, mqtt, serial, etc.)
#   3. capabilities — capability set match (fallback)
#
# Startup policies:
#   always_on  — start with core nodes, always available
#   on_demand  — start when a matching device is registered in UDM
#   lazy       — start on first use, then keep alive
#   shared     — lightweight, start once, shared by many devices

version: 1
mappings:

  # ── Android devices ──
  - match:
      device_type: android_phone
    implementation:
      node: Node_33_ADB
      transport: adb
      port: 8033
      startup: on_demand
      healthcheck: /health
    capabilities:
      provides: [GUI_READ, GUI_WRITE, INPUT_TOUCH, INPUT_VOICE, GUI_SCREENSHOT]
      requires: []

  - match:
      device_type: android_tablet
    implementation:
      node: Node_33_ADB
      transport: adb
      port: 8033
      startup: on_demand
      healthcheck: /health
    capabilities:
      provides: [GUI_READ, GUI_WRITE, INPUT_TOUCH, INPUT_VOICE, GUI_SCREENSHOT]
      requires: []

  - match:
      device_type: android_tv
    implementation:
      node: Node_33_ADB
      transport: adb
      port: 8033
      startup: on_demand
      healthcheck: /health
    capabilities:
      provides: [GUI_READ, INPUT_VOICE]
      requires: []

  # Scrcpy is a lighter alternative for Android screen mirroring
  - match:
      device_type: android_phone
      transport: scrcpy
    implementation:
      node: Node_34_Scrcpy
      transport: scrcpy
      port: 8034
      startup: lazy
      healthcheck: /health
    capabilities:
      provides: [GUI_READ, GUI_STREAM, INPUT_TOUCH]
      requires: []
    note: "lighter alternative to ADB for screen-only use cases"

  # ── Bluetooth LE ──
  - match:
      transport: nfc
    implementation:
      node: Node_44_NFC
      transport: nfc
      port: 8044
      startup: lazy
      healthcheck: /health
    capabilities:
      provides: [COMM_NFC]
      requires: []

  # ── Desktop automation ──
  - match:
      device_type: windows_desktop
    implementation:
      node: Node_45_DesktopAuto
      transport: uiauto
      port: 8045
      startup: on_demand
      healthcheck: /health
    capabilities:
      provides: [GUI_READ, GUI_WRITE, INPUT_KEYBOARD, INPUT_MOUSE, GUI_SCREENSHOT]
      requires: []

  - match:
      device_type: linux_desktop
    implementation:
      node: Node_45_DesktopAuto
      transport: uiauto
      port: 8045
      startup: on_demand
      healthcheck: /health
    capabilities:
      provides: [GUI_READ, GUI_WRITE, INPUT_KEYBOARD, INPUT_MOUSE, GUI_SCREENSHOT]
      requires: []

  - match:
      device_type: macos_desktop
    implementation:
      node: Node_45_DesktopAuto
      transport: uiauto
      port: 8045
      startup: on_demand
      healthcheck: /health
    capabilities:
      provides: [GUI_READ, GUI_WRITE, INPUT_KEYBOARD, INPUT_MOUSE, GUI_SCREENSHOT]
      requires: []

  # ── Camera ──
  - match:
      capabilities: [SENSOR_CAMERA]
    implementation:
      node: Node_46_Camera
      transport: camera
      port: 8046
      startup: lazy
      healthcheck: /health
    capabilities:
      provides: [SENSOR_CAMERA, GUI_STREAM]
      requires: []

  # ── Audio / Microphone ──
  - match:
      capabilities: [SENSOR_MIC]
    implementation:
      node: Node_47_Audio
      transport: audio
      port: 8047
      startup: shared
      healthcheck: /health
    capabilities:
      provides: [SENSOR_MIC, INPUT_VOICE]
      requires: []

  # ── Serial / UART ──
  - match:
      device_type: iot_generic
      transport: http
    implementation:
      node: Node_49_OctoPrint
      transport: http
      port: 8050
      startup: lazy
      healthcheck: /health
    capabilities:
      provides: [GUI_READ, GUI_WRITE]
      requires: []
    note: "3D printer via OctoPrint REST API"

# ── 已移除的映射（磁盘上没有实现）────────────────────────────────────────────
# Node_38_BLE / Node_41_MQTT / Node_42_CANbus / Node_48_Serial 曾经在这里各占一条
# 规则，但 nodes/ 下面**从来没有过这四个目录**——它们和 deploy/compose/full.yml 里
# 那 5 个幽灵 service 是同一批：设计好了物理总线节点，实现没跟上。
#
# 之前留着无害（解析出来也没人拿去启动）。按需激活接通之后就变有害了：一台 BLE
# 设备注册进来会解析到 Node_38_BLE 并**真去启动它**，而那个目录不存在——启动失败，
# 日志里多一条谁也看不懂的告警，而设备侧只知道"没能力"。
#
# 移除之后，这些传输类型解析不到节点，日志明说 "no mapping for transport=ble"——
# 那是准确的：确实没有实现。真做出来了再把规则加回来。
