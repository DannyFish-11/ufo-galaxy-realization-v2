[tool.black]
line-length = 120
target-version = ["py311"]
include = "\\.pyi?$"
exclude = '''
/(
  \.git
| \.venv
| venv
| build
| dist
| node_modules
| __pycache__
| \.mypy_cache
| \.pytest_cache
| \.tox
| external
| chroma_db
)/
'''

[tool.isort]
profile = "black"
line_length = 120
known_first_party = ["core", "nodes", "galaxy_gateway", "enhancements", "dashboard", "config", "skills", "scripts", "tests"]
skip = ["external", "chroma_db", ".venv", "venv", "node_modules", "build", "dist"]

[tool.flake8]
max-line-length = 120
extend-ignore = ["E203", "W503"]
exclude = ".git,__pycache__,.venv,venv,build,dist,node_modules,external,chroma_db"
per-file-ignores = ["__init__.py:F401"]

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
no_implicit_optional = true
strict_optional = true
follow_imports = "silent"
show_error_codes = true
# Exclude generated/legacy/large modules and third-party stubs
exclude = [
    "nodes/",
    "enhancements/",
    "dashboard/",
    "external/",
    "build/",
    "dist/",
    "\\.venv/",
    "venv/",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
asyncio_mode = "auto"
markers = [
    "s6_smoke: PR-S6 regression & compatibility guardrail smoke suite",
    "g7_smoke: PR-G7 developer-experience quick-verify smoke suite",
    "slow: slow tests (skipped by default in fast CI runs)",
    "manual: manual integration tests that require live services (always skipped in CI)",
]