<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxy - 配置中心</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@400;500;700;900&display=swap');

        * { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background: #000000; overflow: hidden; user-select: none; }

        /* ── Galaxy 背景 ── */
        .galaxy-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(ellipse at 50% 50%, #0a0a1a 0%, #000000 70%),
                        radial-gradient(circle at 25% 75%, rgba(100, 60, 255, 0.08) 0%, transparent 50%),
                        radial-gradient(circle at 75% 25%, rgba(0, 180, 255, 0.08) 0%, transparent 50%);
            z-index: -2;
        }
        .stars { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; overflow: hidden; }
        .star { position: absolute; background: white; border-radius: 50%; animation: twinkle var(--duration) ease-in-out infinite; }
        @keyframes twinkle { 0%, 100% { opacity: var(--opacity); } 50% { opacity: 0.1; } }

        /* ── 灵动岛核心 ── */
        .dynamic-island {
            position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(40px) saturate(180%);
            -webkit-backdrop-filter: blur(40px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 44px; height: 44px; min-width: 200px; padding: 0 20px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; z-index: 100;
            transition: all 0.5s cubic-bezier(0.25, 0.1, 0.25, 1);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5), inset 0 0.5px 0 rgba(255, 255, 255, 0.06);
        }
        .dynamic-island:hover { border-color: rgba(255, 255, 255, 0.15); }
        .dynamic-island.expanded {
            top: 12px; width: calc(100% - 80px); max-width: 960px;
            height: calc(100vh - 24px); border-radius: 28px;
            padding: 0; cursor: default; align-items: stretch; flex-direction: column;
        }

        .island-tabs { display: flex; gap: 2px; padding: 6px; background: rgba(255, 255, 255, 0.04); border-radius: 18px; margin: 12px 16px 0; }
        .island-tab { flex: 1; padding: 8px 12px; border-radius: 14px; font-size: 13px; font-weight: 500; color: rgba(255, 255, 255, 0.45); text-align: center; transition: all 0.3s; cursor: pointer; }
        .island-tab:hover { color: rgba(255, 255, 255, 0.7); }
        .island-tab.active { background: rgba(255, 255, 255, 0.1); color: #ffffff; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3); }

        .glass-card { background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 18px; backdrop-filter: blur(20px); transition: all 0.3s ease; }
        .glass-card:hover { background: rgba(255, 255, 255, 0.06); border-color: rgba(255, 255, 255, 0.1); }
        .island-input { background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 22px; color: #fff; transition: all 0.3s ease; }
        .island-input:focus { border-color: rgba(0, 212, 255, 0.4); box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.08); outline: none; }
        .island-input::placeholder { color: rgba(255, 255, 255, 0.25); }
        .send-btn { background: linear-gradient(135deg, #0a84ff, #7c5cfc); border-radius: 20px; border: none; color: white; font-weight: 600; transition: all 0.2s ease; }
        .send-btn:hover { opacity: 0.9; transform: scale(1.02); }
        .send-btn:active { transform: scale(0.98); }

        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .status-dot.online { background: #30d158; box-shadow: 0 0 6px rgba(48, 209, 88, 0.5); }
        .status-dot.offline { background: #ff453a; }
        .valid { color: #30d158; }
        .invalid { color: #ff453a; }
        .pending { color: #ffd60a; }
        .close-pill { width: 36px; height: 5px; background: rgba(255, 255, 255, 0.2); border-radius: 3px; margin: 8px auto 4px; cursor: pointer; transition: all 0.2s; }
        .close-pill:hover { background: rgba(255, 255, 255, 0.4); width: 48px; }
        .provider-chip { background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 14px; padding: 12px; transition: all 0.2s; }
        .provider-chip:hover { background: rgba(255, 255, 255, 0.07); }
        .btn-sm { padding: 5px 12px; border-radius: 10px; font-size: 12px; font-weight: 500; transition: all 0.2s; border: none; cursor: pointer; }
        .btn-blue { background: rgba(10, 132, 255, 0.2); color: #0a84ff; }
        .btn-blue:hover { background: rgba(10, 132, 255, 0.3); }
        .btn-green { background: rgba(48, 209, 88, 0.2); color: #30d158; }
        .btn-green:hover { background: rgba(48, 209, 88, 0.3); }
        .btn-purple { background: rgba(124, 92, 252, 0.2); color: #7c5cfc; }
        .btn-purple:hover { background: rgba(124, 92, 252, 0.3); }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 2px; }
    </style>
</head>
<body class="text-white min-h-screen">
    <div class="galaxy-bg"></div>
    <div class="stars" id="starsContainer"></div>

    <div id="app">
        <div class="dynamic-island" :class="{ expanded: isExpanded }">

            <!-- 收缩状态 -->
            <div v-if="!isExpanded" @click="isExpanded = true" class="flex items-center space-x-3 w-full justify-center">
                <div class="status-dot" :class="configuredCount > 0 ? 'online' : 'offline'"></div>
                <span style="font-family: 'Orbitron', monospace; font-size: 13px; font-weight: 600; letter-spacing: 2px; background: linear-gradient(135deg, #0a84ff, #7c5cfc); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">GALAXY</span>
                <span style="font-size: 11px; color: rgba(255,255,255,0.3); font-variant-numeric: tabular-nums;">{{ currentTime }}</span>
                <span v-if="configuredCount > 0" style="font-size: 11px; color: rgba(48,209,88,0.7);">{{ configuredCount }} ✓</span>
            </div>

            <!-- 展开状态 -->
            <template v-if="isExpanded">
                <div class="close-pill" @click="isExpanded = false"></div>

                <!-- Tab 导航: 配置优先 -->
                <div class="island-tabs">
                    <div class="island-tab" :class="{ active: tab === 'llm' }" @click="tab = 'llm'">⚙️ LLM</div>
                    <div class="island-tab" :class="{ active: tab === 'nodeapis' }" @click="tab = 'nodeapis'; loadNodeApis()">🌐 节点 API</div>
                    <div class="island-tab" :class="{ active: tab === 'protocols' }" @click="tab = 'protocols'; loadProtocols()">🔌 协议</div>
                    <div class="island-tab" :class="{ active: tab === 'devices' }" @click="tab = 'devices'; loadDevices()">📱 设备</div>
                    <div class="island-tab" :class="{ active: tab === 'agents' }" @click="tab = 'agents'; loadAgents()">🤖 Agent</div>
                    <div class="island-tab" :class="{ active: tab === 'tools' }" @click="tab = 'tools'">🔧 工具</div>
                    <div class="island-tab" :class="{ active: tab === 'permissions' }" @click="tab = 'permissions'; loadPermissions()">🔐 权限</div>
                    <div class="island-tab" :class="{ active: tab === 'integrations' }" @click="tab = 'integrations'; loadIntegrations()">🔗 集成</div>
                    <div class="island-tab" :class="{ active: tab === 'test' }" @click="tab = 'test'">🧪 测试</div>
                    <div class="island-tab" :class="{ active: tab === 'traces' }" @click="tab = 'traces'; loadDeviceTraces()">📋 执行链路</div>
                    <div class="island-tab" :class="{ active: tab === 'collab' }" @click="tab = 'collab'; loadAgentDeviceMapping()">🔗 协同视图</div>
                    <div class="island-tab" :class="{ active: tab === 'orch' }" @click="tab = 'orch'; loadOrchestrationTasks()">🗂️ 编排</div>
                </div>

                <div style="flex: 1; overflow: hidden; display: flex; flex-direction: column; padding: 8px 16px 16px;">

                    <!-- ═══ LLM 提供商配置 ═══ -->
                    <div v-show="tab === 'llm'" style="flex: 1; overflow-y: auto;" class="space-y-3">
                        <div class="glass-card p-4">
                            <div class="grid grid-cols-5 gap-3 text-center">
                                <div><div style="font-size: 22px; font-weight: 700; color: #0a84ff;">{{ configStatus.total_models || 0 }}</div><div style="font-size: 11px; color: rgba(255,255,255,0.3);">总模型</div></div>
                                <div><div style="font-size: 22px; font-weight: 700; color: #30d158;">{{ configStatus.configured_models || 0 }}</div><div style="font-size: 11px; color: rgba(255,255,255,0.3);">已配置</div></div>
                                <div><div style="font-size: 22px; font-weight: 700; color: #7c5cfc;">{{ configStatus.total_tools || 0 }}</div><div style="font-size: 11px; color: rgba(255,255,255,0.3);">工具</div></div>
                                <div><div style="font-size: 22px; font-weight: 700; color: #ff375f;">{{ configStatus.configured_tools || 0 }}</div><div style="font-size: 11px; color: rgba(255,255,255,0.3);">工具已配</div></div>
                                <div><div style="font-size: 22px; font-weight: 700;" :style="{ color: configStatus.oneapi_configured ? '#30d158' : '#ff453a' }">{{ configStatus.oneapi_configured ? '✓' : '✗' }}</div><div style="font-size: 11px; color: rgba(255,255,255,0.3);">OneAPI</div></div>
                            </div>
                        </div>
                        <div class="glass-card p-4">
                            <div style="font-size: 14px; font-weight: 600; margin-bottom: 10px;">🔗 OneAPI 聚合器</div>
                            <div class="grid grid-cols-3 gap-2">
                                <input v-model="oneapiUrl" type="text" placeholder="Base URL" class="island-input px-3 py-2" style="font-size: 12px; border-radius: 12px;">
                                <input v-model="oneapiKey" type="password" placeholder="API Key" class="island-input px-3 py-2" style="font-size: 12px; border-radius: 12px;">
                                <div class="flex space-x-1.5">
                                    <button @click="saveOneAPI" class="btn-sm btn-blue flex-1">保存</button>
                                    <button @click="validateOneAPI" class="btn-sm btn-green flex-1">验证</button>
                                </div>
                            </div>
                            <div v-if="oneapiStatus" class="mt-2" style="font-size: 11px;" :class="oneapiStatus.valid ? 'valid' : 'invalid'">{{ oneapiStatus.message || oneapiStatus.error }}</div>
                        </div>
                        <div class="glass-card p-4">
                            <div style="font-size: 14px; font-weight: 600; margin-bottom: 10px;">🤖 模型提供商</div>
                            <div class="grid grid-cols-4 gap-2">
                                <div v-for="(provider, name) in directProviders" :key="name" class="provider-chip">
                                    <div class="flex items-center justify-between mb-2">
                                        <span style="font-size: 12px; font-weight: 500;">{{ provider.name }}</span>
                                        <span :class="provider.valid ? 'valid' : (provider.apiKey ? 'pending' : '')" style="font-size: 11px; opacity: 0.6;">{{ provider.valid ? '✓' : (provider.apiKey ? '?' : '✗') }}</span>
                                    </div>
                                    <input v-model="provider.apiKey" type="password" placeholder="API Key" class="island-input w-full px-2.5 py-1.5 mb-1.5" style="font-size: 11px; border-radius: 10px;">
                                    <div class="flex space-x-1">
                                        <button @click="saveProvider(name, provider.apiKey)" class="btn-sm btn-purple flex-1">保存</button>
                                        <button @click="validateProvider(name)" class="btn-sm btn-green flex-1">验证</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- ═══ 节点 API 配置（新增核心功能）═══ -->
                    <div v-show="tab === 'nodeapis'" style="flex: 1; overflow-y: auto;" class="space-y-3">
                        <div class="glass-card p-4">
                            <div class="flex items-center justify-between mb-2">
                                <span style="font-size: 14px; font-weight: 600;">🌐 节点 API 配置</span>
                                <div class="flex space-x-2 items-center">
                                    <span style="font-size: 11px; color: rgba(255,255,255,0.35);">{{ nodeApis.filter(n => n.all_configured).length }}/{{ nodeApis.length }} 已配置</span>
                                    <button @click="autoScanNodeApis" class="btn-sm btn-purple">🔍 自动扫描</button>
                                    <button @click="loadNodeApis" class="btn-sm btn-blue">刷新</button>
                                </div>
                            </div>
                            <div style="font-size: 11px; color: rgba(255,255,255,0.25); margin-bottom: 10px;">填入各节点所需的 API Key，激活系统能力</div>
                        </div>

                        <!-- 按类别分组 -->
                        <div v-for="cat in nodeApiCategories" :key="cat.id" class="glass-card p-4">
                            <div style="font-size: 13px; font-weight: 600; margin-bottom: 8px;">{{ cat.icon }} {{ cat.label }}</div>
                            <div class="grid grid-cols-2 gap-2">
                                <div v-for="node in nodeApis.filter(n => n.category === cat.id)" :key="node.node_id" class="provider-chip">
                                    <div class="flex items-center justify-between mb-1.5">
                                        <span style="font-size: 12px; font-weight: 500;">{{ node.name }}</span>
                                        <span style="font-size: 10px;" :class="node.all_configured ? 'valid' : 'invalid'">{{ node.all_configured ? '✓ 已配置' : '✗ 待配置' }}</span>
                                    </div>
                                    <div v-for="key in node.keys" :key="key.env_var" class="mb-1.5">
                                        <div style="font-size: 10px; color: rgba(255,255,255,0.3); margin-bottom: 2px;">{{ key.label }} ({{ key.env_var }})</div>
                                        <div class="flex space-x-1.5">
                                            <input v-model="key.inputValue" :type="key.env_var.includes('URL') ? 'text' : 'password'" :placeholder="key.configured ? key.masked : key.label" class="island-input flex-1 px-2.5 py-1.5" style="font-size: 11px; border-radius: 10px;">
                                            <button @click="saveNodeApiKey(key.env_var, key.inputValue || '')" class="btn-sm btn-purple" style="padding: 4px 8px; font-size: 10px;">保存</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- ═══ 协议管理 (MCP / Skill) ═══ -->
                    <div v-show="tab === 'protocols'" style="flex: 1; overflow-y: auto;" class="space-y-3">
                        <div class="glass-card p-4">
                            <div class="grid grid-cols-4 gap-3 text-center">
                                <div><div style="font-size: 22px; font-weight: 700; color: #0a84ff;">{{ mcpServers.length }}</div><div style="font-size: 11px; color: rgba(255,255,255,0.3);">MCP 服务</div></div>
                                <div><div style="font-size: 22px; font-weight: 700; color: #30d158;">{{ mcpServers.filter(s => s.status === 'running').length }}</div><div style="font-size: 11px; color: rgba(255,255,255,0.3);">运行中</div></div>
                                <div><div style="font-size: 22px; font-weight: 700; color: #7c5cfc;">{{ skills.length }}</div><div style="font-size: 11px; color: rgba(255,255,255,0.3);">Skill 包</div></div>
                                <div><div style="font-size: 22px; font-weight: 700; color: #ff375f;">{{ skills.filter(s => s.status === 'loaded').length }}</div><div style="font-size: 11px; color: rgba(255,255,255,0.3);">已加载</div></div>
                            </div>
                        </div>
                        <div class="glass-card p-4">
                            <div class="flex items-center justify-between mb-3">
                                <span style="font-size: 14px; font-weight: 600;">🔌 MCP 服务器</span>
                                <div class="flex space-x-2">
                                    <button @click="loadProtocols" class="btn-sm btn-blue">刷新</button>
                                </div>
                            </div>
                            <div v-if="mcpServers.length === 0" style="text-align: center; color: rgba(255,255,255,0.25); font-size: 12px; padding: 20px 0;">暂无 MCP 服务器</div>
                            <div class="space-y-2">
                                <div v-for="server in mcpServers" :key="server.name" class="provider-chip">
                                    <div class="flex items-center justify-between mb-2">
                                        <div class="flex items-center space-x-2">
                                            <span class="status-dot" :class="server.status === 'running' ? 'online' : 'offline'"></span>
                                            <span style="font-size: 12px; font-weight: 600;">{{ server.name }}</span>
                                            <span style="font-size: 10px; color: rgba(255,255,255,0.3); background: rgba(255,255,255,0.05); padding: 1px 6px; border-radius: 6px;">{{ server.tool_count || 0 }} tools</span>
                                        </div>
                                        <div class="flex space-x-1.5">
                                            <button @click="toggleMcpTools(server)" class="btn-sm btn-blue" style="padding: 2px 8px; font-size: 10px;">{{ server.showTools ? '收起' : '工具' }}</button>
                                            <button @click="unloadMcp(server.name)" class="btn-sm" style="background: rgba(255,69,58,0.15); color: #ff453a; padding: 2px 8px; font-size: 10px;">卸载</button>
                                        </div>
                                    </div>
                                    <div v-if="server.description" style="font-size: 10px; color: rgba(255,255,255,0.3);">{{ server.description }}</div>
                                    <div v-if="server.showTools && server.tools" class="mt-2 space-y-1">
                                        <div v-for="tool in server.tools" :key="tool.name" style="background: rgba(0,0,0,0.2); border-radius: 8px; padding: 6px 8px;">
                                            <div style="font-size: 11px; font-weight: 500; color: #0a84ff;">{{ tool.name }}</div>
                                            <div style="font-size: 10px; color: rgba(255,255,255,0.3);">{{ tool.description }}</div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="glass-card p-4">
                            <div class="flex items-center justify-between mb-3">
                                <span style="font-size: 14px; font-weight: 600;">📦 Skill 包</span>
                            </div>
                            <div v-if="skills.length === 0" style="text-align: center; color: rgba(255,255,255,0.25); font-size: 12px; padding: 20px 0;">暂无 Skill 包</div>
                            <div class="grid grid-cols-3 gap-2">
                                <div v-for="skill in skills" :key="skill.name" class="provider-chip">
                                    <div class="flex items-center justify-between mb-1">
                                        <span style="font-size: 12px; font-weight: 500;">{{ skill.name }}</span>
                                        <span style="font-size: 10px;" :class="skill.status === 'loaded' ? 'valid' : 'invalid'">{{ skill.status }}</span>
                                    </div>
                                    <div style="font-size: 10px; color: rgba(255,255,255,0.25);">{{ skill.description || '—' }}</div>
                                    <div class="flex space-x-1 mt-2">
                                        <button v-if="skill.status !== 'loaded'" @click="loadSkill(skill.name)" class="btn-sm btn-green flex-1" style="font-size: 10px;">加载</button>
                                        <button v-else @click="unloadSkill(skill.name)" class="btn-sm flex-1" style="background: rgba(255,69,58,0.15); color: #ff453a; font-size: 10px;">卸载</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- ═══ 设备管理 ═══ -->
                    <div v-show="tab === 'devices'" style="flex: 1; overflow-y: auto;" class="space-y-3">
                        <div class="glass-card p-4">
                            <div class="grid grid-cols-3 gap-3 text-center">
                                <div><div style="font-size: 22px; font-weight: 700; color: #0a84ff;">{{ deviceList.length }}</div><div style="font-size: 11px; color: rgba(255,255,255,0.3);">注册设备</div></div>
                                <div><div style="font-size: 22px; font-weight: 700; color: #30d158;">{{ deviceList.filter(d => d.online).length }}</div><div style="font-size: 11px; color: rgba(255,255,255,0.3);">在线</div></div>
                                <div><div style="font-size: 22px; font-weight: 700; color: #ff375f;">{{ deviceList.filter(d => !d.online).length }}</div><div style="font-size: 11px; color: rgba(255,255,255,0.3);">离线</div></div>
                            </div>
                        </div>
                        <div class="glass-card p-4">
                            <div class="flex items-center justify-between mb-3">
                                <span style="font-size: 14px; font-weight: 600;">📱 设备列表</span>
                                <div class="flex space-x-2">
                                    <button @click="discoverDevices" class="btn-sm btn-purple">主动发现</button>
                                    <button @click="loadDevices" class="btn-sm btn-blue">刷新</button>
                                </div>
                            </div>
                            <div v-if="deviceList.length === 0" style="text-align: center; color: rgba(255,255,255,0.25); font-size: 12px; padding: 20px 0;">暂无注册设备</div>
                            <div class="space-y-2">
                                <div v-for="device in deviceList" :key="device.device_id" class="provider-chip">
                                    <div class="flex items-center justify-between mb-2">
                                        <div class="flex items-center space-x-2">
                                            <span class="status-dot" :class="device.online ? 'online' : 'offline'"></span>
                                            <span style="font-size: 12px; font-weight: 600;">{{ device.device_name || device.device_id }}</span>
                                            <span style="font-size: 10px; color: rgba(255,255,255,0.3); background: rgba(255,255,255,0.05); padding: 1px 6px; border-radius: 6px;">{{ device.device_type || 'unknown' }}</span>
                                        </div>
                                        <div class="flex space-x-1.5">
                                            <button @click="showDeviceTelemetry(device)" class="btn-sm btn-blue" style="padding: 2px 8px; font-size: 10px;">遥测</button>
                                            <button @click="sendDeviceCmd(device.device_id)" class="btn-sm btn-green" style="padding: 2px 8px; font-size: 10px;">命令</button>
                                        </div>
                                    </div>
                                    <div style="font-size: 10px; color: rgba(255,255,255,0.25);">
                                        <span v-if="device.os_version">OS: {{ device.os_version }} </span>
                                        <span v-if="device.last_seen"> | 最近活跃: {{ device.last_seen }}</span>
                                    </div>
                                    <div v-if="device.capabilities && device.capabilities.length" class="mt-1 flex flex-wrap gap-1">
                                        <span v-for="cap in device.capabilities" :key="cap" style="font-size: 9px; background: rgba(124,92,252,0.15); color: #7c5cfc; padding: 1px 5px; border-radius: 4px;">{{ cap }}</span>
                                    </div>

        (() => {
            const c = document.getElementById('starsContainer');

                const s = document.createElement('div');

                s.style.left = Math.random() * 100 + '%';
                s.style.top = Math.random() * 100 + '%';
                const size = Math.random() * 1.5 + 0.5 + 'px';
                s.style.width = size; s.style.height = size;
                s.style.setProperty('--duration', (Math.random() * 4 + 3) + 's');
                s.style.setProperty('--opacity', Math.random() * 0.4 + 0.2);
                c.appendChild(s);
            }
        })();

        const { createApp, ref, onMounted, computed } = Vue;

        createApp({
            setup() {
                const isExpanded = ref(false);
                const tab = ref('llm');
                const currentTime = ref('');
                const configStatus = ref({});
                const oneapiUrl = ref('http://localhost:8001/v1');
                const oneapiKey = ref('');
                const oneapiStatus = ref(null);

                const directProviders = ref({
                    openai: { name: 'OpenAI', apiKey: '', valid: false },
                    anthropic: { name: 'Anthropic', apiKey: '', valid: false },
                    deepseek: { name: 'DeepSeek', apiKey: '', valid: false },
                    zhipu: { name: '智谱 AI', apiKey: '', valid: false },
                    groq: { name: 'Groq', apiKey: '', valid: false },
                    openrouter: { name: 'OpenRouter', apiKey: '', valid: false },
                    gemini: { name: 'Gemini', apiKey: '', valid: false },
                    qwen: { name: '通义千问', apiKey: '', valid: false },
                    xai: { name: 'xAI', apiKey: '', valid: false },
                    together: { name: 'Together', apiKey: '', valid: false },
                    perplexity: { name: 'Perplexity', apiKey: '', valid: false }
                });

                const nodeApis = ref([]);
                const nodeApiCategories = ref([
                    { id: 'search', icon: '🔍', label: '搜索服务' },
                    { id: 'translation', icon: '🌍', label: '翻译' },
                    { id: 'code', icon: '💻', label: '代码管理' },
                    { id: 'data', icon: '📊', label: '数据服务' },
                    { id: 'vision', icon: '👁', label: '视觉识别' },
                    { id: 'media', icon: '🎬', label: '媒体生成' },
                    { id: 'hardware', icon: '🖨', label: '硬件设备' },
                    { id: 'local_llm', icon: '🏠', label: '本地 LLM' },
                    { id: 'llm', icon: '🔗', label: 'LLM 聚合补充' },
                ]);

                const agents = ref([]);
                const agentTemplates = ref([]);
                const selectedTemplate = ref('');
                const agentTaskDesc = ref('');
                const agentCreateStatus = ref(null);
                const agentPermissions = ref({ filesystem: false, terminal: false, network: false, browser: false });
                const permissionDefs = [
                    { key: 'filesystem', icon: '📁' },
                    { key: 'terminal',   icon: '⌨️' },
                    { key: 'network',    icon: '🌐' },
                    { key: 'browser',    icon: '🖥️' },
                ];

                // Twin / Swarm
                const twinTask = ref('');
                const twinStrategy = ref('SPECIALIZED');
                const twinCount = ref(2);
                const twinResult = ref('');
                const swarmTask = ref('');
                const swarmCount = ref(3);
                const swarmResult = ref('');

                // Protocols (MCP / Skill)
                const mcpServers = ref([]);
                const skills = ref([]);

                // Devices
                const deviceList = ref([]);
                const crossDeviceSource = ref('');
                const transferSource = ref('');
                const transferTarget = ref('');


                // Permissions methods (P1)
                const loadPermissions = async () => {
                    try {
                        const r = (await axios.get('/api/v1/permissions/policy')).data;
                        permPolicy.value = r;
                    } catch (e) { console.error('加载权限策略失败:', e); }
                };
                const savePermissions = async () => {
                    permSaveStatus.value = null;
                    try {
                        const r = await axios.post('/api/v1/permissions/policy', { global: permPolicy.value.global, agent_overrides: permPolicy.value.agent_overrides });
                        permSaveStatus.value = { success: r.data.success, message: r.data.success ? '策略已保存' : '保存失败' };
                    } catch (e) { permSaveStatus.value = { success: false, message: '保存失败: ' + e.message }; }
                };
                const addAgentOverride = () => {
                    const id = permOverrideAgentId.value.trim();
                    if (!id) return;
                    if (!permPolicy.value.agent_overrides) permPolicy.value.agent_overrides = {};
                    if (!permPolicy.value.agent_overrides[id]) {
                        permPolicy.value.agent_overrides[id] = Object.assign({}, permPolicy.value.global || { filesystem: false, terminal: false, network: true, browser: false });
                    }
                    permOverrideAgentId.value = '';
                };
                const removeAgentOverride = (agentId) => {
                    if (permPolicy.value.agent_overrides) delete permPolicy.value.agent_overrides[agentId];
                };

                // Integrations methods (P1)
                const _INTG_META = {
                    telegram:  { icon: '✈️', name: 'Telegram' },
                    discord:   { icon: '🎮', name: 'Discord' },
                    slack:     { icon: '💬', name: 'Slack' },
                    whatsapp:  { icon: '📱', name: 'WhatsApp' },
                };
                const loadIntegrations = async () => {
                    try {
                        const data = (await axios.get('/api/v1/integrations/config')).data;
                        integrations.value = ['telegram', 'discord', 'slack', 'whatsapp'].map(key => ({
                            key,
                            icon: _INTG_META[key].icon,
                            name: _INTG_META[key].name,
                            ...(data[key] || {}),
                            bot_token_input: '',
                            api_token_input: '',
                            webhook_input: data[key]?.webhook_url || data[key]?.phone_number_id || '',
                        }));
                    } catch (e) { console.error('加载集成配置失败:', e); }
                };
                const saveIntegration = async (intg) => {
                    const payload = { [intg.key]: { enabled: intg.enabled } };
                    if (intg.key === 'whatsapp') {
                        if (intg.webhook_input) payload[intg.key].phone_number_id = intg.webhook_input;
                    } else {
                        if (intg.webhook_input) payload[intg.key].webhook_url = intg.webhook_input;
                    }
                    try { await axios.post('/api/v1/integrations/config', payload); } catch (e) { console.error('保存集成配置失败:', e); }
                };
                const saveIntegrationToken = async (intg) => {
                    const isWhatsApp = intg.key === 'whatsapp';
                    const token = isWhatsApp ? intg.api_token_input : intg.bot_token_input;
                    if (!token) return;
                    const field = isWhatsApp ? 'api_token' : 'bot_token';
                    try {
                        await axios.post('/api/v1/integrations/config', { [intg.key]: { [field]: token } });
                        intg[field + '_configured'] = true;
                        if (isWhatsApp) { intg.api_token_input = ''; } else { intg.bot_token_input = ''; }
                    } catch (e) { alert('保存失败: ' + e.message); }
                };

                // P2: Device execution traces
                const deviceTraces = ref([]);
                const traceFilterDevice = ref('');

                // P2: Agent–Device mapping
                const agentDeviceMappings = ref([]);

                // P2: Orchestration tasks
                const orchTasks = ref([]);

                const tools = ref([]);
                const nodes = ref([]);
                const testMessage = ref('Hello');
                const testResult = ref('');
                const inputMessage = ref('');
                const chatReply = ref('');
                const chatMeta = ref(null);
                const chatExecData = ref({ agent_steps: [], tool_calls: [], error: null });

                // Permissions (P1)
                const permPolicy = ref({ global: { filesystem: false, terminal: false, network: true, browser: false }, agent_overrides: {} });
                const permSaveStatus = ref(null);
                const permOverrideAgentId = ref('');

                // Integrations (P1)
                const integrations = ref([]);

                const configuredCount = computed(() => {
                    let count = 0;
                    if (oneapiKey.value) count++;
                    for (const p of Object.values(directProviders.value)) { if (p.apiKey) count++; }
                    for (const t of tools.value) { if (t.apiKey) count++; }
                    count += nodeApis.value.filter(n => n.all_configured).length;
                    return count;
                });

                const updateTime = () => { currentTime.value = new Date().toLocaleTimeString('zh-CN', { hour12: false }); };

                const loadConfigStatus = async () => { try { configStatus.value = (await axios.get('/api/v1/config/status')).data; } catch (e) {} };
                const loadTools = async () => { try { tools.value = ((await axios.get('/api/v1/config/tools')).data.tools || []).map(t => ({ ...t, status: '' })); } catch (e) {} };
                const loadNodes = async () => {
                    try {
                        const all = (await axios.get('/api/v1/nodes/all')).data.nodes || [];
                        if (all.length > 0) {
                            nodes.value = all;
                            return;
                        }
                    } catch (e) { /* fall through */ }
                    try {
                        const rt = (await axios.get('/api/v1/nodes/runtime')).data.nodes || [];
                        if (rt.length > 0) {
                            nodes.value = rt;
                            return;
                        }
                    } catch (e) { /* fall through to config nodes */ }
                    try {
                        nodes.value = (await axios.get('/api/v1/config/nodes')).data.nodes || [];
                    } catch (e) {}
                };
                const loadNodeApis = async () => {
                    try {
                        const data = (await axios.get('/api/v1/config/node-apis')).data;
                        nodeApis.value = (data.node_apis || []).map(n => ({
                            ...n,
                            keys: n.keys.map(k => ({ ...k, inputValue: '' }))
                        }));
                    } catch (e) { console.error(e); }
                };
                const autoScanNodeApis = async () => {
                    try {
                        const data = (await axios.get('/api/v1/config/node-apis/auto')).data;
                        const scanned = (data.node_apis || []).map(n => ({
                            ...n,
                            keys: n.keys.map(k => ({ ...k, inputValue: '' }))
                        }));
                        // 合并到现有列表（以 node_id 为 key）
                        const merged = {};
                        for (const n of nodeApis.value) merged[n.node_id] = n;
                        for (const n of scanned) {
                            if (merged[n.node_id]) {
                                // 追加未知的 key
                                const existingVars = new Set(merged[n.node_id].keys.map(k => k.env_var));
                                for (const k of n.keys) {
                                    if (!existingVars.has(k.env_var)) merged[n.node_id].keys.push(k);
                                }
                            } else {
                                merged[n.node_id] = n;
                            }
                        }
                        nodeApis.value = Object.values(merged);
                    } catch (e) { alert('自动扫描失败: ' + (e.response?.data?.error || e.message)); }
                };
                const saveNodeApiKey = async (envVar, value) => {
                    if (!value) return;
                    try {
                        await axios.post('/api/v1/config/node-api-key', { env_var: envVar, value });
                        loadNodeApis();
                    } catch (e) { alert('保存失败: ' + (e.response?.data?.error || e.message)); }
                };

                const loadAgents = async () => { try { agents.value = (await axios.get('/api/v1/agents')).data.agents || []; } catch (e) {} };
                const createTwin = async () => {
                    if (!twinTask.value.trim()) return;
                    twinResult.value = '创建中...';
                    try {
                        const r = await axios.post('/api/v1/agents/twin', { task: twinTask.value, strategy: twinStrategy.value, member_count: twinCount.value });
                        twinResult.value = r.data.success ? `团队 ${r.data.team_id} 创建成功` : (r.data.error || '创建失败');
                        twinTask.value = ''; loadAgents();
                    } catch (e) { twinResult.value = '失败: ' + (e.response?.data?.detail || e.message); }
                };
                const createSwarm = async () => {
                    if (!swarmTask.value.trim()) return;
                    swarmResult.value = '创建中...';
                    try {
                        const r = await axios.post('/api/v1/agents/swarm', { task: swarmTask.value, agent_count: swarmCount.value });
                        swarmResult.value = r.data.success ? `Swarm (${r.data.agent_count} agents) 创建成功` : (r.data.error || '创建失败');
                        swarmTask.value = ''; loadAgents();
                    } catch (e) { swarmResult.value = '失败: ' + (e.response?.data?.detail || e.message); }
                };

                // Protocol methods
                const loadProtocols = async () => {
                    try { mcpServers.value = ((await axios.get('/api/v1/protocols/mcp')).data.servers || []).map(s => ({ ...s, showTools: false, tools: [] })); } catch (e) {}
                    try { skills.value = (await axios.get('/api/v1/protocols/skills')).data.skills || []; } catch (e) {}
                };
                const toggleMcpTools = async (server) => {
                    if (server.showTools) { server.showTools = false; return; }
                    try { server.tools = (await axios.get('/api/v1/protocols/mcp/' + server.name + '/tools')).data.tools || []; } catch (e) { server.tools = []; }
                    server.showTools = true;
                };
                const unloadMcp = async (name) => { try { await axios.delete('/api/v1/protocols/mcp/' + name); loadProtocols(); } catch (e) {} };
                const loadSkill = async (name) => { try { await axios.post('/api/v1/protocols/skills/load', { name }); loadProtocols(); } catch (e) {} };
                const unloadSkill = async (name) => { try { await axios.delete('/api/v1/protocols/skills/' + name); loadProtocols(); } catch (e) {} };

                // Device methods
                const loadDevices = async () => { try { deviceList.value = (await axios.get('/api/v1/devices')).data.devices || []; } catch (e) {} };
                const discoverDevices = async () => { try { await axios.post('/api/v1/devices/discover-active'); loadDevices(); } catch (e) {} };
                const showDeviceTelemetry = async (device) => {
                    try { device.telemetry = (await axios.get('/api/v1/devices/' + device.device_id + '/telemetry')).data; } catch (e) { device.telemetry = { error: e.message }; }
                };
                const sendDeviceCmd = async (deviceId) => {
                    const cmd = prompt('命令名称:');
                    if (!cmd) return;
                    try { await axios.post('/api/v1/devices/' + deviceId + '/command', { command: cmd, params: {} }); alert('命令已发送'); } catch (e) { alert('发送失败: ' + e.message); }
                };
                const syncClipboard = async () => {
                    if (!crossDeviceSource.value) return;
                    try { await axios.post('/api/v1/devices/cross-device', { command: 'clipboard_sync', context: { source_device: crossDeviceSource.value } }); } catch (e) {}
                };
                const transferFile = async () => {
                    if (!transferSource.value || !transferTarget.value) return;
                    const path = prompt('源文件路径:');
                    if (!path) return;
                    try { await axios.post('/api/v1/devices/transfer', { source_device: transferSource.value, target_device: transferTarget.value, file_path: path }); alert('传输请求已发送'); } catch (e) { alert('传输失败: ' + e.message); }
                };
                const loadAgentTemplates = async () => { try { agentTemplates.value = (await axios.get('/api/v1/agents/templates')).data.templates || []; } catch (e) {} };
                const createAgentFromTemplate = async () => {
                    if (!selectedTemplate.value) return;
                    agentCreateStatus.value = null;
                    try {
                        const r = await axios.post('/api/v1/agents/create', { template: selectedTemplate.value, permissions: agentPermissions.value });
                        agentCreateStatus.value = { success: true, message: `Agent "${r.data.agent.name}" 创建成功` };
                        selectedTemplate.value = '';
                        loadAgents();
                    } catch (e) { agentCreateStatus.value = { success: false, message: '创建失败: ' + (e.response?.data?.error || e.message) }; }
                };
                const createAgentDynamic = async () => {
                    if (!agentTaskDesc.value.trim()) return;
                    agentCreateStatus.value = { success: true, message: '智能生成中...' };
                    try {
                        const r = await axios.post('/api/v1/agents/create/dynamic', { task_description: agentTaskDesc.value.trim(), permissions: agentPermissions.value });
                        agentCreateStatus.value = { success: true, message: `Agent "${r.data.agent.name}" 智能生成成功` };
                        agentTaskDesc.value = '';
                        loadAgents();
                    } catch (e) { agentCreateStatus.value = { success: false, message: '生成失败: ' + (e.response?.data?.error || e.message) }; }
                };
                const deleteAgent = async (agentId) => { try { await axios.delete('/api/v1/agents/' + agentId); loadAgents(); } catch (e) {} };

                const saveOneAPI = async () => { try { await axios.post('/api/v1/config/api-key', { provider: 'oneapi', api_key: oneapiKey.value }); loadConfigStatus(); } catch (e) { alert('保存失败: ' + e.message); } };
                const validateOneAPI = async () => {
                    oneapiStatus.value = { valid: false, message: '验证中...' };
                    try { oneapiStatus.value = (await axios.post('/api/v1/config/validate', { category: 'oneapi', key_name: '' })).data; } catch (e) { oneapiStatus.value = { valid: false, error: e.message }; }
                };
                const saveProvider = async (name, apiKey) => { try { await axios.post('/api/v1/config/api-key', { provider: name, api_key: apiKey }); loadConfigStatus(); } catch (e) { alert('保存失败: ' + e.message); } };
                const validateProvider = async (name) => {
                    directProviders.value[name].valid = false;
                    try { directProviders.value[name].valid = (await axios.post('/api/v1/config/validate', { category: 'direct_models', key_name: name })).data.valid; } catch (e) {}
                };
                const saveTool = async (toolId, apiKey) => { try { await axios.post('/api/v1/config/tools/api-key', { tool_id: toolId, api_key: apiKey }); loadConfigStatus(); } catch (e) { alert('保存失败: ' + e.message); } };
                const validateTool = async (toolId) => {
                    const tool = tools.value.find(t => t.tool_id === toolId);
                    if (tool) {
                        tool.status = '验证中...';
                        try { const r = (await axios.post('/api/v1/config/validate', { category: 'tools', key_name: toolId })).data; tool.valid = r.valid; tool.status = r.valid ? '有效' : r.error; } catch (e) { tool.status = e.message; }
                    }
                };
                const validateAllTools = async () => { for (const t of tools.value) { if (t.apiKey) await validateTool(t.tool_id); } };
                const testLLM = async () => {
                    testResult.value = '测试中...';
                    try { testResult.value = JSON.stringify((await axios.post('/api/v1/config/test-llm', { message: testMessage.value })).data, null, 2); } catch (e) { testResult.value = '失败: ' + e.message; }
                };
                const checkNodes = async () => {
                    try { const r = (await axios.post('/api/v1/config/nodes/check')).data.results; nodes.value.forEach(n => { if (n.status === 'inactive') return; n.status = r[n.node_id]?.success ? 'healthy' : 'error'; }); } catch (e) {}
                };
                const sendMessage = async () => {
                    if (!inputMessage.value.trim()) return;
                    chatReply.value = '处理中...';
                    chatMeta.value = null;
                    chatExecData.value = { agent_steps: [], tool_calls: [], error: null };
                    try {
                        const r = await axios.post('/api/v1/chat', { message: inputMessage.value.trim() });
                        chatReply.value = r.data.response || r.data.reply || '处理完成';
                        chatExecData.value = {
                            agent_steps: r.data.agent_steps || [],
                            tool_calls: r.data.tool_calls || [],
                            error: r.data.error || null,
                        };
                        // Surface auto-created agent info if present
                        const data = r.data.data || {};
                        if (data.auto_agent_id || data.auto_agent_template || data.chosen_strategy || data.twin_id) {
                            chatMeta.value = {
                                auto_agent_id: data.auto_agent_id || null,
                                auto_agent_template: data.auto_agent_template || null,
                                chosen_strategy: data.chosen_strategy || null,
                                chosen_providers: data.chosen_providers || null,
                                twin_id: data.twin_id || null,
                                twin_coupling: data.twin_coupling || null,
                            };
                        }
                        inputMessage.value = '';
                    } catch (e) { chatReply.value = '连接失败: ' + e.message; }
                };

                // P2: Device execution traces
                const loadDeviceTraces = async () => {
                    try {
                        const url = traceFilterDevice.value
                            ? `/api/v1/devices/${traceFilterDevice.value}/traces`
                            : '/api/v1/devices/traces';
                        const r = (await axios.get(url)).data;
                        deviceTraces.value = (r.traces || []).reverse();
                    } catch (e) { deviceTraces.value = []; }
                };
                const filteredTraces = computed(() =>
                    traceFilterDevice.value
                        ? deviceTraces.value.filter(t => t.device_id === traceFilterDevice.value)
                        : deviceTraces.value
                );

                // P2: Agent–Device mapping
                const loadAgentDeviceMapping = async () => {
                    try {
                        const r = (await axios.get('/api/v1/agent-device/mapping')).data;
                        agentDeviceMappings.value = r.mappings || [];
                    } catch (e) { agentDeviceMappings.value = []; }
                };

                // P2: Orchestration tasks
                const loadOrchestrationTasks = async () => {
                    try {
                        const r = (await axios.get('/api/v1/orchestration/tasks')).data;
                        orchTasks.value = (r.tasks || []).reverse();
                    } catch (e) { orchTasks.value = []; }
                };

                onMounted(() => {
                    updateTime(); setInterval(updateTime, 1000);
                    loadConfigStatus(); loadTools(); loadNodes(); loadAgentTemplates(); loadNodeApis();
                });

                return {
                    isExpanded, tab, currentTime, configStatus, oneapiUrl, oneapiKey, oneapiStatus,
                    directProviders, nodeApis, nodeApiCategories, agents, agentTemplates,
                    selectedTemplate, agentTaskDesc, agentCreateStatus, agentPermissions, permissionDefs,
                    twinTask, twinStrategy, twinCount, twinResult, swarmTask, swarmCount, swarmResult,
                    mcpServers, skills, deviceList, crossDeviceSource, transferSource, transferTarget,
                    tools, nodes, testMessage, testResult, inputMessage, chatReply, chatMeta, chatExecData, configuredCount,
                    // P2
                    deviceTraces, traceFilterDevice, filteredTraces,
                    agentDeviceMappings, orchTasks,
                    loadDeviceTraces, loadAgentDeviceMapping, loadOrchestrationTasks,
                    loadNodeApis, saveNodeApiKey, autoScanNodeApis, loadAgents, createAgentFromTemplate, createAgentDynamic, deleteAgent,
                    createTwin, createSwarm,
                    loadProtocols, toggleMcpTools, unloadMcp, loadSkill, unloadSkill,
                    loadDevices, discoverDevices, showDeviceTelemetry, sendDeviceCmd, syncClipboard, transferFile,
                    saveOneAPI, validateOneAPI, saveProvider, validateProvider,
                    saveTool, validateTool, validateAllTools, testLLM, checkNodes, sendMessage,
                    permPolicy, permSaveStatus, permOverrideAgentId,
                    integrations,
                    loadPermissions, savePermissions, addAgentOverride, removeAgentOverride,
                    loadIntegrations, saveIntegration, saveIntegrationToken,
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
