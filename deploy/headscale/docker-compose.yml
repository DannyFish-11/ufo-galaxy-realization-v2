# ============================================================
# Headscale — Self-Hosted Tailscale Control Server
# ============================================================
# Provides private Tailscale tailnet for Galaxy devices:
# - V2 Gateway (100.64.0.1)
# - Wear OS Watch (100.64.0.10)
# - Android Phone (100.64.0.11)
# - Other devices...
#
# Usage:
#   cd deploy/headscale
#   docker compose up -d
#   docker compose logs -f
#
# Generate auth key for devices:
#   docker compose exec headscale headscale preauthkeys create --user galaxy --reusable --ephemeral
# ============================================================

services:
  headscale:
    image: headscale/headscale:0.23
    container_name: galaxy-headscale
    restart: unless-stopped

    command: serve

    ports:
      # Control server API (for device registration)
      - "8080:8080"
      # gRPC API
      - "50443:50443"

    volumes:
      - ./config.yaml:/etc/headscale/config.yaml:ro
      - headscale-data:/var/lib/headscale

    networks:
      - galaxy-headscale-net

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # Headscale Web UI for management
  headscale-ui:
    image: ghcr.io/gurucomputing/headscale-ui:latest
    container_name: galaxy-headscale-ui
    restart: unless-stopped

    environment:
      - HEADSCALE_URL=http://headscale:8080

    ports:
      - "3001:80"

    networks:
      - galaxy-headscale-net

    depends_on:
      headscale:
        condition: service_healthy

    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # DERP server (for relay when P2P not possible)
  derp:
    image: fredli/derper:latest
    container_name: galaxy-derp
    restart: unless-stopped

    environment:
      - DERP_VERIFY_CLIENTS=true
      - DERP_DOMAIN=derp.galaxy.local
      - DERP_CERT_MODE=manual

    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "443:443/tcp"

    networks:
      - galaxy-headscale-net

    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

networks:
  galaxy-headscale-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16

volumes:
  headscale-data:
