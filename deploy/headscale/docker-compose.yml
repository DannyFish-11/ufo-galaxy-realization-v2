# ============================================================
# Headscale —— Galaxy 自建 tailnet 的会合点
# ============================================================
# 用法(完整步骤见 README.md):
#   1. 改 config.yaml 里的 server_url 与 tls_letsencrypt_hostname
#   2. docker compose up -d
#   3. ./init.sh        —— 建用户、生成 API key、写进网关配置
#
# 版本钉死:网关用到的 REST 接口(按用户 id 建钥匙、节点带 pre_auth_key)
# 在 0.26 之后才是现在的形状;用 latest 会在某次上游升级时悄悄变样。
# ============================================================

services:
  headscale:
    image: headscale/headscale:0.29.4
    container_name: galaxy-headscale
    restart: unless-stopped
    command: serve
    ports:
      # https:设备登记、网关 API、内置 DERP 中继都走这一个口
      - "443:443"
      # Let's Encrypt 签证书用(HTTP-01)
      - "80:80"
      # STUN:设备探测自己的公网地址,打洞要用
      - "3478:3478/udp"
    volumes:
      - ./config.yaml:/etc/headscale/config.yaml:ro
      - ./acl.hujson:/etc/headscale/acl.hujson:ro
      - headscale-data:/var/lib/headscale
      - headscale-run:/var/run/headscale
    healthcheck:
      test: ["CMD", "headscale", "health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  headscale-data:
  headscale-run:
