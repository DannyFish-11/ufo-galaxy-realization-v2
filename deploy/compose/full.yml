# ============================================================
# Galaxy — Full System Docker Compose
# Single-source-of-truth: config/unified_ports.yaml
#
# SURFACE ROLE: Full system / integration testing
# Use this when you need all 130 nodes or a complete system demo.
# See docs/DEPLOYMENT_SURFACES.md for the full surface catalogue.
# ============================================================
#
# SECURITY — Infrastructure Secrets
# All infrastructure passwords and secrets are sourced from environment
# variables. Before starting, copy .env.example to .env and set every
# variable marked "REQUIRED FOR PRODUCTION" to a strong, unique value.
#
#   cp .env.example .env
#   # edit .env — fill in all credential variables
#   docker compose -f deploy/compose/full.yml --env-file .env up -d
#
# NEVER commit a populated .env file or embed real passwords in this file.
# ============================================================
#
# Profiles:
#   (none / default)  – Infrastructure only
#   core              – Infrastructure + critical nodes
#   full              – Everything (all 130 nodes + infra)
#   worker            – Go edge worker
#
# Quick start:
#   docker compose -f deploy/compose/full.yml up -d                   # infra only
#   docker compose -f deploy/compose/full.yml --profile core up -d    # core nodes
#   docker compose -f deploy/compose/full.yml --profile full up -d    # all nodes
#
# All ports derive from config/unified_ports.yaml.
# ============================================================

name: galaxy-full

services:
  # ================================================================
  # INFRASTRUCTURE SERVICES (no profile — always start)
  # ================================================================

  redis:
    image: redis:7-alpine
    container_name: galaxy-redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - galaxy-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: galaxy-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - galaxy-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:6333/readyz"]
      interval: 15s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5.15-community
    container_name: galaxy-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:?NEO4J_PASSWORD must be set — see .env.example}
      - NEO4J_PLUGINS=["apoc","graph-data-science"]
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    networks:
      - galaxy-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 20s
      timeout: 10s
      retries: 5

  mongodb:
    image: mongo:7
    container_name: galaxy-mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USERNAME:-mongoadmin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD must be set — see .env.example}
    volumes:
      - mongodb-data:/data/db
    networks:
      - galaxy-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2.10-alpine
    container_name: galaxy-nats
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data
    networks:
      - galaxy-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  temporal-db:
    image: postgres:15-alpine
    container_name: galaxy-temporal-db
    environment:
      - POSTGRES_USER=${TEMPORAL_DB_USER:-temporal}
      - POSTGRES_PASSWORD=${TEMPORAL_DB_PASSWORD:?TEMPORAL_DB_PASSWORD must be set — see .env.example}
      - POSTGRES_DB=temporal
    volumes:
      - temporal-db-data:/var/lib/postgresql/data
    networks:
      - galaxy-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 10s
      timeout: 5s
      retries: 5

  temporal:
    image: temporalio/auto-setup:1.22
    container_name: galaxy-temporal
    ports:
      - "7233:7233"
    environment:
      - DB=postgresql
      - DB_PORT=5432
      - POSTGRES_USER=${TEMPORAL_DB_USER:-temporal}
      - POSTGRES_PWD=${TEMPORAL_DB_PASSWORD:?TEMPORAL_DB_PASSWORD must be set — see .env.example}
      - POSTGRES_SEEDS=temporal-db
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
    depends_on:
      temporal-db:
        condition: service_healthy
    networks:
      - galaxy-network
    restart: unless-stopped

  temporal-ui:
    image: temporalio/ui:2.21
    container_name: galaxy-temporal-ui
    ports:
      - "8233:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:8233
    depends_on:
      - temporal
    networks:
      - galaxy-network
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: galaxy-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - galaxy-network
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  oneapi:
    image: justsong/one-api:latest
    container_name: galaxy-oneapi
    profiles: [full]
    ports:
      - "3001:3000"
    environment:
      - SQL_DSN=
      - SESSION_SECRET=${ONEAPI_SESSION_SECRET:?ONEAPI_SESSION_SECRET must be set — see .env.example}
      - REDIS_CONN_STRING=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - oneapi-data:/data
    networks:
      - galaxy-network
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: galaxy-minio
    profiles: [full]
    command: server /data --console-address ":9001"
    ports:
      - "9002:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-galaxy_admin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set — see .env.example}
    volumes:
      - minio-data:/data
    networks:
      - galaxy-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5

  coturn:
    image: coturn/coturn:latest
    container_name: galaxy-coturn
    profiles: [full]
    network_mode: host
    environment:
      - DETECT_EXTERNAL_IP=yes
      - REALM=galaxy.local
    volumes:
      - coturn-data:/var/lib/coturn
    restart: unless-stopped

  # ── Galaxy Core API + Management UI ──────────────────────────
  galaxy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: galaxy-core
    ports:
      - "9000:9000"
    env_file:
      - .env
    environment:
      - GALAXY_MODE=production
      - NEO4J_URI=bolt://neo4j:7687
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379
      - MONGODB_URI=mongodb://mongoadmin:mongoadmin123@mongodb:27017
      - OLLAMA_URL=http://ollama:11434
      - GALAXY_NATS_URL=nats://nats:4222
      - GALAXY_TEMPORAL_URL=temporal:7233
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    volumes:
      - ./core:/app/core:ro
      - ./config:/app/config:ro
      - ./nodes:/app/nodes:ro
      - galaxy-data:/app/data
      - galaxy-logs:/app/logs
    networks:
      - galaxy-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Galaxy API Gateway ────────────────────────────────────────
  galaxy-gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: galaxy-gateway
    ports:
      - "9000:9000"
    env_file:
      - .env
    environment:
      - GALAXY_NATS_URL=nats://nats:4222
      - QDRANT_URL=http://qdrant:6333
      - NEO4J_URI=bolt://neo4j:7687
      - MONGODB_URI=mongodb://mongoadmin:mongoadmin123@mongodb:27017
      - OLLAMA_URL=http://ollama:11434
    depends_on:
      - nats
      - redis
    networks:
      - galaxy-network
    restart: unless-stopped

  # ── Unified Launcher (admin management UI — port 8299 intentional;
  #    cannot use 9000 here because galaxy-core already binds that port.
  #    All primary client traffic must go through galaxy-core:9000.) ────
  galaxy-launcher:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: galaxy-launcher
    profiles: [core, full]
    command: ["python", "main.py"]
    ports:
      - "9000:9000"  # Admin UI only — use galaxy-core:9000 for all API/client connections
    env_file:
      - .env
    environment:
      - GALAXY_MODE=production
      - REDIS_URL=redis://redis:6379
      - QDRANT_URL=http://qdrant:6333
      - GALAXY_NATS_URL=nats://nats:4222
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./config:/app/config:ro
      - ./nodes:/app/nodes:ro
      - ./core:/app/core:ro
      - galaxy-data:/app/data
      - galaxy-logs:/app/logs
    networks:
      - galaxy-network
    restart: unless-stopped

  # ── Galaxy Edge Worker ────────────────────────────────────────
  galaxy-worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: galaxy-worker
    profiles: [worker, full]
    environment:
      - GALAXY_NATS_URL=nats://nats:4222
      - GALAXY_WORKER_ID=worker-docker-01
      - GALAXY_WORKER_TYPE=linux
      - GALAXY_WORKER_PORT=8300
    ports:
      - "8300:8300"
    depends_on:
      nats:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - galaxy-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8300/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ================================================================
  # GALAXY NODES (profile: core = critical; full = all)
  # ================================================================

  # Node_01_OneAPI — 统一API网关
  node-01-oneapi:
    build:
      context: .
      dockerfile: Dockerfile.node
      args:
        NODE_NAME: Node_01_OneAPI
        NODE_PORT: "7995"
    container_name: galaxy-node-01-oneapi
    profiles: [core]
    ports:
      - "7995:7995"
    environment:
      - REDIS_URL=redis://redis:6379
      - QDRANT_URL=http://qdrant:6333
      - GALAXY_NATS_URL=nats://nats:4222
      - STATE_MACHINE_URL=http://node-00-statemachine:8000
      - NODE_NAME=Node_01_OneAPI
      - NODE_PORT=7995
      - NODE_ID=Node_01_OneAPI
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./config:/app/config:ro
      - ./nodes:/app/nodes:ro
      - ./core:/app/core:ro
      - galaxy-data:/app/data
    networks:
      - galaxy-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:7995/health"]
      interval: 20s
      timeout: 5s
      start_period: 30s
      retries: 3

  # Node_09_Sandbox — 沙箱执行环境
  node-09-sandbox:
    build:
      context: .
      dockerfile: Dockerfile.node
      args:
        NODE_NAME: Node_09_Sandbox
        NODE_PORT: "7996"
    container_name: galaxy-node-09-sandbox
    profiles: [full]
    ports:
      - "7996:7996"
    environment:
      - REDIS_URL=redis://redis:6379
      - QDRANT_URL=http://qdrant:6333
      - GALAXY_NATS_URL=nats://nats:4222
      - STATE_MACHINE_URL=http://node-00-statemachine:8000
      - NODE_NAME=Node_09_Sandbox
      - NODE_PORT=7996
      - NODE_ID=Node_09_Sandbox
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./config:/app/config:ro
      - ./nodes:/app/nodes:ro
      - ./core:/app/core:ro
      - galaxy-data:/app/data
    networks:
      - galaxy-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:7996/health"]
      interval: 20s
      timeout: 5s
      start_period: 30s
      retries: 3

  # Node_110_SmartOrchestrator — 智能编排器
  node-110-smartorchestrator:
    build:
      context: .
      dockerfile: Dockerfile.node
      args:
        NODE_NAME: Node_110_SmartOrchestrator
        NODE_PORT: "7997"
    container_name: galaxy-node-110-smartorchestrator
    profiles: [full]
    ports:
      - "7997:7997"
    environment:
      - REDIS_URL=redis://redis:6379
      - QDRANT_URL=http://qdrant:6333
      - GALAXY_NATS_URL=nats://nats:4222
      - STATE_MACHINE_URL=http://node-00-statemachine:8000
      - NODE_NAME=Node_110_SmartOrchestrator
      - NODE_PORT=7997
      - NODE_ID=Node_110_SmartOrchestrator
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./config:/app/config:ro
      - ./nodes:/app/nodes:ro
      - ./core:/app/core:ro
      - galaxy-data:/app/data
    networks:
      - galaxy-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:7997/health"]
      interval: 20s
      timeout: 5s
      start_period: 30s
      retries: 3

  # Node_111_ContextManager — 上下文管理器
  node-111-contextmanager:
    build:
      context: .
      dockerfile: Dockerfile.node
      args:
        NODE_NAME: Node_111_ContextManager
        NODE_PORT: "7998"
    container_name: galaxy-node-111-contextmanager
    profiles: [full]
    ports:
      - "7998:7998"
    environment:
      - REDIS_URL=redis://redis:6379
      - QDRANT_URL=http://qdrant:6333
      - GALAXY_NATS_URL=nats://nats:4222
      - STATE_MACHINE_URL=http://node-00-statemachine:8000
      - NODE_NAME=Node_111_ContextManager
      - NODE_PORT=7998
      - NODE_ID=Node_111_ContextManager
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./config:/app/config:ro
      - ./nodes:/app/nodes:ro
      - ./core:/app/core:ro
      - galaxy-data:/app/data
    networks:
      - galaxy-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:7998/health"]
      interval: 20s
      timeout: 5s
      start_period: 30s
      retries: 3

  # Node_112_SelfHealing — 自愈系统
  node-112-selfhealing:
    build:
      context: .
      dockerfile: Dockerfile.node
      args:
        NODE_NAME: Node_112_SelfHealing
        NODE_PORT: "7999"
    container_name: galaxy-node-112-selfhealing
    profiles: [full]
    ports:
      - "7999:7999"
    environment:
      - REDIS_URL=redis://redis:6379
      - QDRANT_URL=http://qdrant:6333
      - GALAXY_NATS_URL=nats://nats:4222
      - STATE_MACHINE_URL=http://node-00-statemachine:8000
      - NODE_NAME=Node_112_SelfHealing
      - NODE_PORT=7999
      - NODE_ID=Node_112_SelfHealing
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./config:/app/config:ro
      - ./nodes:/app/nodes:ro
      - ./core:/app/core:ro
      - galaxy-data:/app/data
    networks:
      - galaxy-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:7999/health"]
      interval: 20s
      timeout: 5s
      start_period: 30s
      retries: 3

  # Node_00_StateMachine — 状态机核心 - 系统状态管理
  node-00-statemachine:
    build:
      context: .
      dockerfile: Dockerfile.node
      args:
        NODE_NAME: Node_00_StateMachine
        NODE_PORT: "8000"
    container_name: galaxy-node-00-statemachine
    profiles: [core]
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379
      - QDRANT_URL=http://qdrant:6333
      - GALAXY_NATS_URL=nats://nats:4222
      - STATE_MACHINE_URL=http://node-00-statemachine:8000
      - NODE_NAME=Node_00_StateMachine
      - NODE_PORT=8000
      - NODE_ID=Node_00_StateMachine
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./config:/app/config:ro
      - ./nodes:/app/nodes:ro
      - ./core:/app/core:ro
      - galaxy-data:/app/data
    networks:
      - galaxy-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 20s
      timeout: 5s
      start_period: 30s
      retries: 3

  # Node_02_Tasker — 任务调度引擎
  node-02-tasker:
    build:
      context: .
      dockerfile: Dockerfile.node
      args:
        NODE_NAME: Node_02_Tasker
        NODE_PORT: "8002"
    container_name: galaxy-node-02-tasker
    profiles: [core]
    ports:
      - "8002:8002"
    environment:
      - REDIS_URL=redis://redis:6379
      - QDRANT_URL=http://qdrant:6333
      - GALAXY_NATS_URL=nats://nats:4222
      - STATE_MACHINE_URL=http://node-00-statemachine:8000
      - NODE_NAME=Node_02_Tasker
      - NODE_PORT=8002
      - NODE_ID=Node_02_Tasker
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./config:/app/config:ro
      - ./nodes:/app/nodes:ro
      - ./core:/app/core:ro
      - galaxy-data:/app/data
    networks:
      - galaxy-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8002/health"]
      interval: 20s
      timeout: 5s
      start_period: 30s
      retries: 3

  # Node_03_SecretVault — 密钥保险箱
  node-03-secretvault:
    build:
      context: .
      dockerfile: Dockerfile.node
      args:
        NODE_NAME: Node_03_SecretVault
        NODE_PORT: "8003"
    container_name: galaxy-node-03-secretvault
    profiles: [core]
    ports:
      - "8003:8003"
    environment:
      - REDIS_URL=redis://redis:6379
      - QDRANT_URL=http://qdrant:6333
      - GALAXY_NATS_URL=nats://nats:4222
      - STATE_MACHINE_URL=http://node-00-statemachine:8000
      - NODE_NAME=Node_03_SecretVault
      - NODE_PORT=8003
      - NODE_ID=Node_03_SecretVault
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./config:/app/config:ro
      - ./nodes:/app/nodes:ro
      - ./core:/app/core:ro
      - galaxy-data:/app/data
    networks:
      - galaxy-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8003/health"]
      interval: 20s
      timeout: 5s
      start_period: 30s
      retries: 3

  # Node_04_Router — 全局路由器
  node-04-router:
    build:
      context: .
      dockerfile: Dockerfile.node
      args:
        NODE_NAME: Node_04_Router
        NODE_PORT: "8004"
    container_name: galaxy-node-04-router
    profiles: [core]
    ports:
      - "8004:8004"
    environment:
      - REDIS_URL=redis://redis:6379
      - QDRANT_URL=http://qdrant:6333
      - GALAXY_NATS_URL=nats://nats:4222
      - STATE_MACHINE_URL=http://node-00-statemachine:8000
      - NODE_NAME=Node_04_Router
      - NODE_PORT=8004
      - NODE_ID=Node_04_Router
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./config:/app/config:ro
      - ./nodes:/app/nodes:ro
      - ./core:/app/core:ro
      - galaxy-data:/app/data
    networks:
      - galaxy-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8004/health"]
      interval: 20s
      timeout: 5s
      start_period: 30s
      retries: 3

  # Node_05_Auth — 认证授权中心
  node-05-auth:
    build:
      context: .
      dockerfile: Dockerfile.node
      args:
        NODE_NAME: Node_05_Auth
        NODE_PORT: "8005"
    container_name: galaxy-node-05-auth
    profiles: [core]
    ports:
      - "8005:8005"
    environment:
      - REDIS_URL=redis://redis:6379
      - QDRANT_URL=http://qdrant:6333
      - GALAXY_NATS_URL=nats://nats:4222
      - STATE_MACHINE_URL=http://node-00-statemachine:8000
      - NODE_NAME=Node_05_Auth
      - NODE_PORT=8005
      - NODE_ID=Node_05_Auth
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./config:/app/config:ro
      - ./nodes:/app/nodes:ro
      - ./core:/app/core:ro
      - galaxy-data:/app/data
    networks:
      - galaxy-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8005/health"]
      interval: 20s
      timeout: 5s
      start_period: 30s
      retries: 3

  # Node_06_Filesystem — 文件系统管理
  node-06-filesystem:
    build:
      context: .
      dockerfile: Dockerfile.node
      args:
        NODE_NAME: Node_06_Filesystem
        NODE_PORT: "8006"
    container_name: galaxy-node-06-filesystem
    profiles: [core]
    ports:
      - "8006:8006"
    environment:
      - REDIS_URL=redis://redis:6379
