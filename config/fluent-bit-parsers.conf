# Galaxy — Fluent Bit Parsers

[PARSER]
    Name        json
    Format      json
    Time_Key    timestamp
    Time_Format %Y-%m-%dT%H:%M:%S.%L

[PARSER]
    Name        galaxy_log
    Format      regex
    Regex       ^(?<time>\d{2}:\d{2}:\d{2}) \| (?<level>\w+) \| (?<module>[^ ]+) \| (?<message>.*)$
    Time_Key    time
    Time_Format %H:%M:%S
