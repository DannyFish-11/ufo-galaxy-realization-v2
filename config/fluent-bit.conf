# UFO Galaxy — Fluent Bit Log Pipeline
# ======================================

[SERVICE]
    Flush           5
    Daemon          Off
    Log_Level       info
    Parsers_File    parsers.conf
    HTTP_Server     On
    HTTP_Listen     0.0.0.0
    HTTP_Port       2020

# ── Inputs ──

# Galaxy application logs
[INPUT]
    Name            tail
    Tag             galaxy.app
    Path            /logs/galaxy*.log
    Refresh_Interval 10
    Mem_Buf_Limit   10MB
    Skip_Long_Lines On
    DB              /tmp/flb_galaxy.db

# Galaxy access logs
[INPUT]
    Name            tail
    Tag             galaxy.access
    Path            /logs/access*.log
    Refresh_Interval 10
    Mem_Buf_Limit   5MB
    DB              /tmp/flb_access.db

# Galaxy error logs
[INPUT]
    Name            tail
    Tag             galaxy.error
    Path            /logs/error*.log
    Refresh_Interval 5
    Mem_Buf_Limit   5MB
    DB              /tmp/flb_error.db

# ── Filters ──

# Add service metadata
[FILTER]
    Name            modify
    Match           galaxy.*
    Add             cluster ufo-galaxy
    Add             environment production

# Parse JSON logs if present
[FILTER]
    Name            parser
    Match           galaxy.app
    Key_Name        log
    Parser          json
    Reserve_Data    On

# ── Outputs ──

# Stdout (for docker logs)
[OUTPUT]
    Name            stdout
    Match           galaxy.error
    Format          json_lines

# Forward to file (rotated)
[OUTPUT]
    Name            file
    Match           *
    Path            /logs/aggregated
    Format          plain
