name: Environment Coupling Detector

# 找出"结论取决于机器上恰好有什么"的测试。
#
# 为什么单开一个工作流,而不是塞进 ci.yml
# --------------------------------------
# 它要把同一批用例**跑两遍**(干净 / 带环境桩),成本是常规分片的两倍。放进 PR 流水线
# 会让每个 PR 都多等一倍时间,去换一类**变化极慢**的缺陷 —— 这类耦合是随新测试写进来的,
# 不是每次改代码都会新增。所以按天跑,加手动触发,PR 时延不受影响。
#
# 为什么不设成阻塞闸
# ------------------
# 本仓刚吃过教训:File Complexity Budget 是 --strict 阻塞的,红了几十轮之后没人再看,
# 那道闸等于不存在。新引入的检查先以告警形态跑,等基线确实干净、团队认可它的信号质量,
# 再考虑加 --strict。工具本身支持,改一个参数即可。
#
# 已确认它能抓到的真实事故(两起都曾经 CI 恒绿、只砸本机开发者):
#   * tests/test_mesh_worker_panel_toggle.py —— 依赖"本机没有 nats-server",
#     而测试自己会把它装上并常驻,前提自我毁灭,此后永久红且不自愈。
#   * tests/test_pr52_desktop_native_ingress_backbone.py —— 依赖"本机没有 Ollama",
#     可这个项目的安装文档**要求**装 Ollama。

on:
  schedule:
    # 每天 03:00 UTC。挑在主流水线的低谷,两遍全量跑不抢资源。
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      strict:
        description: "发现耦合就让本次运行失败"
        type: boolean
        default: false

jobs:
  detect:
    name: Environment Coupling (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    # 单片要跑两遍,给常规分片(25 分钟)的两倍再加余量。
    timeout-minutes: 55
    permissions:
      contents: read
    strategy:
      # 一片有发现不该取消其它片 —— 要的是完整清单。
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      # 分片沿用 scripts/ci_test_shard.py —— 与主流水线同一套切法(CRC 稳定分配),
      # 这样"第 N 片"在两个工作流里指的是同一批文件,对照日志时不会错位。
      - name: Detect environment-coupled tests
        run: |
          python scripts/detect_environment_coupled_tests.py \
            --shard ${{ matrix.shard }} --of 4 \
            ${{ (github.event_name == 'workflow_dispatch' && inputs.strict) && '--strict' || '' }}

  summary:
    name: Environment Coupling Summary
    runs-on: ubuntu-latest
    needs: detect
    if: always()
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: 汇总
        run: |
          echo "分片整体结果: ${{ needs.detect.result }}"
          if [ "${{ needs.detect.result }}" != "success" ]; then
            echo "::warning::发现环境耦合的测试(或分片本身失败),详见各 shard 作业日志"
          fi
