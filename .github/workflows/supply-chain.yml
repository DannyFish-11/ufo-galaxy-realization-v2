name: Supply-Chain Security (PR-G4)

# =============================================================================
# PR-G4: Supply-Chain & Image Security
#
# Jobs:
#   hash-verify   — Install core deps with --require-hashes to enforce integrity.
#   sbom-sign     — Build main images, generate SBOM (syft), sign with cosign.
#   sbom-verify   — Verify cosign signatures for built artifacts.
#   node-security-report — Generate per-node security report artifacts.
# =============================================================================

on:
  push:
    branches: [main]
    paths:
      - "requirements.txt"
      - "requirements.in"
      - "requirements.hash.txt"
      - "Dockerfile"
      - "Dockerfile.gateway"
      - "Dockerfile.node"
      - ".github/workflows/supply-chain.yml"
  pull_request:
    branches: [main]
    paths:
      - "requirements.txt"
      - "requirements.in"
      - "requirements.hash.txt"
      - "Dockerfile"
      - "Dockerfile.gateway"
      - "Dockerfile.node"
      - ".github/workflows/supply-chain.yml"
  # Weekly scheduled run to catch newly-discovered CVEs in pinned deps
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch: {}

jobs:
  # ---------------------------------------------------------------------------
  # Job 1 — Hash verification for core Python dependencies
  # ---------------------------------------------------------------------------
  hash-verify:
    name: Verify hashed deps (requirements.hash.txt)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install pip-tools
        run: pip install pip-tools

      - name: Verify requirements.hash.txt is present
        run: |
          if [ ! -f requirements.hash.txt ]; then
            echo "❌  requirements.hash.txt is missing."
            echo "    Run: scripts/pin_deps.sh"
            exit 1
          fi
          echo "✅  requirements.hash.txt found ($(wc -l < requirements.hash.txt) lines)."

      - name: Verify requirements.hash.txt is up-to-date
        run: |
          pip-compile --generate-hashes --quiet \
            --output-file /tmp/requirements.hash.check.txt \
            requirements.in
          # Strip the autogenerated header line that contains the exact command
          # (it differs between local and CI environments) before comparing.
          tail -n +7 requirements.hash.txt > /tmp/committed.stripped.txt
          tail -n +7 /tmp/requirements.hash.check.txt > /tmp/generated.stripped.txt
          if diff -q /tmp/committed.stripped.txt /tmp/generated.stripped.txt >/dev/null 2>&1; then
            echo "✅  requirements.hash.txt is up-to-date."
          else
            echo "❌  requirements.hash.txt is out-of-date."
            echo "    Run: scripts/pin_deps.sh"
            diff /tmp/committed.stripped.txt /tmp/generated.stripped.txt | head -40
            exit 1
          fi

      - name: Install core deps with --require-hashes
        run: |
          pip install --require-hashes -r requirements.hash.txt
          echo "✅  Hash-verified install succeeded."

  # ---------------------------------------------------------------------------
  # Job 2 — SBOM generation + cosign signing for the main Galaxy images
  # ---------------------------------------------------------------------------
  sbom-sign:
    name: Generate SBOM and sign images
    runs-on: ubuntu-latest
    # Keyless cosign signing requires id-token for OIDC
    permissions:
      contents: read
      packages: write
      id-token: write

    # Only run on pushes to main (not PRs) to avoid signing unreviewed code
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: galaxy-main
            dockerfile: Dockerfile
            context: .
          - name: galaxy-gateway
            dockerfile: Dockerfile.gateway
            context: .
          - name: galaxy-node
            dockerfile: Dockerfile.node
            context: .
            build-args: "NODE_NAME=Node_02_Tasker\nNODE_PORT=8002"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: "v2.4.0"

      # Build the image and export the digest for cosign/SBOM
      - name: Build image (${{ matrix.name }})
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: "localhost/${{ matrix.name }}:${{ github.sha }}"
          build-args: ${{ matrix.build-args || '' }}
          outputs: type=docker,dest=/tmp/${{ matrix.name }}.tar

      # Generate SBOM using the Anchore SBOM action (wraps syft)
      - name: Generate SBOM — ${{ matrix.name }}
        uses: anchore/sbom-action@v0
        with:
          image: "localhost/${{ matrix.name }}:${{ github.sha }}"
          artifact-name: "${{ matrix.name }}.sbom.spdx.json"
          output-file: "/tmp/${{ matrix.name }}.sbom.spdx.json"
          format: spdx-json

      # Sign the SBOM attestation with cosign (keyless / Sigstore OIDC)
      - name: Sign SBOM attestation — ${{ matrix.name }} (keyless)
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          # cosign requires a registry reference to attach attestations;
          # for local images we sign the SBOM file itself as a blob.
          cosign sign-blob \
            --yes \
            --output-signature "/tmp/${{ matrix.name }}.sbom.sig" \
            "/tmp/${{ matrix.name }}.sbom.spdx.json"
          echo "✅  SBOM blob signed."

      # Verify the signature immediately after signing (self-check)
      - name: Verify SBOM signature — ${{ matrix.name }}
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          cosign verify-blob \
            --signature "/tmp/${{ matrix.name }}.sbom.sig" \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}/*" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "/tmp/${{ matrix.name }}.sbom.spdx.json"
          echo "✅  SBOM signature verified."

      # Upload SBOM + signature as CI artifacts
      - name: Upload SBOM artifact — ${{ matrix.name }}
        uses: actions/upload-artifact@v4
        with:
          name: "sbom-${{ matrix.name }}-${{ github.sha }}"
          path: |
            /tmp/${{ matrix.name }}.sbom.spdx.json
            /tmp/${{ matrix.name }}.sbom.sig
          retention-days: 90

  # ---------------------------------------------------------------------------
  # Job 3 — Per-node security report (lightweight, no Docker required)
  # ---------------------------------------------------------------------------
  node-security-report:
    name: Generate per-node security reports
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate per-node security reports
        run: |
          python scripts/gen_node_security_report.py \
            --no-sig-check \
            --output-dir /tmp/security-reports
          echo "✅  Reports generated."

      - name: Validate security summary schema
        run: |
          python - <<'EOF'
          import json, sys

          with open("/tmp/security-reports/security-summary.json") as f:
              summary = json.load(f)

          required = ["schema_version", "generated_at", "total_nodes",
                      "nodes_with_sbom", "nodes_with_verified_signature",
                      "nodes_with_hash_locked_deps", "nodes"]
          for field in required:
              if field not in summary:
                  print(f"❌  Missing required field in summary: {field}")
                  sys.exit(1)

          if summary["total_nodes"] == 0:
              print("❌  No nodes found in security summary.")
              sys.exit(1)

          # All nodes must have hash-locked deps (requirements.hash.txt present)
          unlocked = [n["node"] for n in summary["nodes"] if not n["hash_locked"]]
          if unlocked:
              print(f"❌  Nodes without hash-locked deps: {unlocked}")
              sys.exit(1)

          print(
              f"✅  Security summary valid — {summary['total_nodes']} nodes, "
              f"all hash-locked."
          )
          EOF

      - name: Upload security reports artifact
        uses: actions/upload-artifact@v4
        with:
          name: "node-security-reports-${{ github.sha }}"
          path: /tmp/security-reports/
          retention-days: 90
