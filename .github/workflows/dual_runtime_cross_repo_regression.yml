name: Dual-Runtime Cross-Repo Regression

on:
  repository_dispatch:
    types: [android-dual-runtime-regression]
  workflow_dispatch:
    inputs:
      evidence_json:
        description: "Android runtime evidence JSON (raw JSON or base64-encoded JSON)"
        required: false
        type: string

env:
  PYTHONUNBUFFERED: "1"
  GALAXY_ENV: "test"

jobs:
  dual-runtime-cross-repo:
    name: Dual-Runtime Cross-Repo Regression (Android ↔ V2)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Materialize Android runtime evidence (dispatch/manual hook)
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_EVIDENCE_JSON: ${{ github.event.client_payload.evidence_json }}
          MANUAL_EVIDENCE_JSON: ${{ inputs.evidence_json }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          event_name = os.environ.get("EVENT_NAME", "").strip()
          raw = (
              os.environ.get("DISPATCH_EVIDENCE_JSON", "").strip()
              or os.environ.get("MANUAL_EVIDENCE_JSON", "").strip()
          )

          if not raw:
              if event_name == "repository_dispatch":
                  raise SystemExit(
                      "repository_dispatch requires client_payload.evidence_json"
                  )
              print("No external evidence payload provided. Tests will use skip-safe mode.")
              raise SystemExit(0)

          payload = None
          try:
              payload = json.loads(raw)
          except Exception:
              try:
                  payload = json.loads(base64.b64decode(raw).decode("utf-8"))
              except Exception as exc:
                  raise SystemExit(f"Unable to parse evidence_json payload: {exc}")

          if not isinstance(payload, dict):
              raise SystemExit("evidence_json payload must decode to a JSON object")

          out_path = Path(".dual_runtime_cross_repo_evidence.json")
          out_path.write_text(json.dumps(payload), encoding="utf-8")
          github_env = os.environ.get("GITHUB_ENV")
          if github_env:
              with open(github_env, "a", encoding="utf-8") as f:
                  f.write(
                      "DUAL_RUNTIME_CROSS_REPO_EVIDENCE_PATH="
                      f"{out_path.resolve()}\n"
                  )
          print(f"Materialized cross-repo evidence: {out_path.resolve()}")
          PY
      - name: Run dual-runtime cross-repo regression entry points
        env:
          REAL_ANDROID_GOVERNANCE_EVIDENCE_PATH: ${{ env.DUAL_RUNTIME_CROSS_REPO_EVIDENCE_PATH }}
        run: |
          python -m pytest \
            tests/integration/test_pr13a_dual_runtime_cross_repo_regression.py \
            tests/integration/test_pr6a_real_android_execution_governance_regression.py \
            -v --tb=short -p no:warnings
