name: "CodeQL Security Analysis"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run every Monday at 08:00 UTC
    - cron: "0 8 * * 1"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [python]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # Optional: specify a custom query suite
          # queries: security-extended,security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        id: analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
          # 把 SARIF 同时落到磁盘,而不只是上传到 Security 页。
          output: sarif-results

      # ── 为什么要把 SARIF 留成 artifact ────────────────────────────────────
      # 分析结果此前**只**进 Security 页。那意味着任何没有 code-scanning 读权限的人
      # 或工具都拿不到告警原文 —— 包括 CI 里的后续步骤、外部审计脚本、以及在本仓
      # 实际发生过的情形:排查时只知道"还有 6 条告警",却读不到是哪 6 条、在哪一行、
      # 属于哪条 query,只能靠人打开网页转述。转述会丢信息,也无法自动化。
      #
      # 落成 artifact 之后,告警变成**机器可读且可离线获取**的:
      #   gh run download <run-id> -n codeql-sarif-python
      # 拿到的是与 Security 页同源的同一份 SARIF(analyze 动作产出的就是它),
      # 不是另算一遍的近似物。
      #
      # if: always() —— 分析失败时更需要看到已产出的部分结果。
      - name: Upload SARIF as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: sarif-results/
          if-no-files-found: warn
          # 保留 90 天:足以覆盖"发现问题 → 回溯是哪次引入的"这个跨度,
          # 又不会让每周一次的定时扫描无限堆积。
          retention-days: 90

      # 把"有几条、分别是什么"直接打进作业摘要**和作业日志**,连 artifact 都不用下载就能看见。
      # 这一步是纯读:不改判定、不影响 analyze 的成败,只是把已有信息呈现出来。
      #
      # 为什么非要同时打进日志(tee):
      # 第一版只写 $GITHUB_STEP_SUMMARY。结果是加完 artifact + 摘要之后,告警**依然读不到** ——
      # 摘要只能在网页上看,artifact 要有 token 才下得下来,而作业日志是唯一一个
      # 「任何能看 CI 的人和工具都拿得到原文」的地方。实测就卡在这:artifact 有了、
      # 摘要有了,想知道那 6 条是什么仍然只能靠人打开网页转述。
      # 摘要保持紧凑(每条 rule 一行),日志里则打全量清单 —— 日志有的是地方。
      - name: Summarise findings
        if: always()
        run: |
          python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, pathlib, collections
          out = []
          detail = []
          for path in sorted(pathlib.Path("sarif-results").glob("*.sarif")):
              try:
                  data = json.loads(path.read_text(encoding="utf-8"))
              except Exception as exc:
                  out.append(f"- `{path.name}` 读取失败: {exc}")
                  continue
              for run in data.get("runs", []):
                  results = run.get("results", []) or []
                  by_rule = collections.Counter(r.get("ruleId", "?") for r in results)
                  out.append(f"### `{path.name}` — {len(results)} 条")
                  if not results:
                      out.append("_无告警。_")
                      continue
                  out.append("")
                  out.append("| rule | 条数 | 首个位置 |")
                  out.append("|---|---:|---|")
                  first = {}
                  for r in results:
                      rid = r.get("ruleId", "?")
                      locs = r.get("locations") or []
                      phys = (locs[0].get("physicalLocation") if locs else {}) or {}
                      art = (phys.get("artifactLocation") or {}).get("uri", "?")
                      line = (phys.get("region") or {}).get("startLine", "?")
                      where = f"{art}:{line}"
                      first.setdefault(rid, where)
                      # 全量清单:每条告警的规则、位置、severity 与原文消息。
                      # 这份只进日志,不进摘要 —— 摘要要能一眼看完,日志要能照着改代码。
                      detail.append(
                          {
                              "rule": rid,
                              "at": where,
                              "severity": (r.get("properties") or {}).get("problem.severity", "?"),
                              "message": ((r.get("message") or {}).get("text") or "").strip(),
                          }
                      )
                  for rid, n in by_rule.most_common():
                      out.append(f"| `{rid}` | {n} | {first.get(rid, '?')} |")
          print("## CodeQL 结果\n")
          print("\n".join(out) if out else "_没有找到 SARIF 文件。_")
          if detail:
              # 这段前缀让人(和抓日志的工具)一眼定位到全量清单从哪儿开始。
              print("\n<!-- 以下全量清单只在作业日志里可见 -->")
              print("\n===== CODEQL FULL FINDINGS (%d) =====" % len(detail))
              for i, d in enumerate(sorted(detail, key=lambda x: (x["rule"], x["at"])), 1):
                  print(f"{i}. [{d['severity']}] {d['rule']}")
                  print(f"     {d['at']}")
                  print(f"     {d['message']}")
              print("===== END CODEQL FULL FINDINGS =====")
          PY
