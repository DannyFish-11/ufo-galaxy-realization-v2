name: Engineering Guardrails (PR-8)

# =============================================================================
# PR-8: Engineering Guardrails & Regression Prevention
#
# Jobs:
#   type-check             — mypy static type analysis (gradual baseline)
#   secret-scan            — gitleaks secret / credential scanning
#   import-boundaries      — enforce layered import rules (core ↛ gateway)
#   file-complexity        — flag files that exceed line-count budgets
#   debt-freeze            — architecture debt detection (Batch PR-1)
#   legacy-regression-guard — block reintroduction of deleted legacy paths (PR-8)
#   workflow-yaml          — 工作流文件里 Actions 会拒收而 PyYAML 会放行的写法
# =============================================================================

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------------
  # A. Type checking — mypy with a pragmatic gradual baseline
  # ---------------------------------------------------------------------------
  type-check:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Install stub packages
        # Install type stubs for common libraries so mypy has something to check
        # against.  Missing stubs are silenced via ignore_missing_imports = true.
        run: |
          pip install types-PyYAML types-requests types-python-dateutil || true

      - name: Run mypy (gradual baseline — core & galaxy_gateway)
        # Uses mypy.ini for per-module configuration.
        # New modules added to core/ or galaxy_gateway/routing/ are checked
        # strictly; legacy/large modules are silenced.
        # The job reports all findings but does NOT fail CI unless mypy itself
        # exits non-zero (i.e., internal error or a strictly-checked module fails).
        run: |
          mypy core/ galaxy_gateway/ \
            --config-file mypy.ini \
            --no-error-summary \
            2>&1 | tee /tmp/mypy-output.txt || true

          # Surface any errors from strictly-checked modules
          STRICT_ERRORS=$(grep -E "(core/canonical_execution_chain|core/mainline_convergence|galaxy_gateway/routing).*: error:" \
            /tmp/mypy-output.txt || true)
          if [ -n "$STRICT_ERRORS" ]; then
            echo ""
            echo "❌ mypy errors in strictly-checked modules:"
            echo "$STRICT_ERRORS"
            exit 1
          fi
          echo "✅ mypy type-check passed (no errors in strict-mode modules)."

  # ---------------------------------------------------------------------------
  # B. Secret scanning — gitleaks
  # ---------------------------------------------------------------------------
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history needed for accurate baseline comparison
          fetch-depth: 0

      # gitleaks-action@v2 **不接受 `args` 输入**。原先这里传了 6 个 flag,
      # runner 每次都打一句 `##[warning]Unexpected input(s) 'args', valid inputs
      # are ['']`,然后**把它们全部丢掉**,自己拼命令:
      #
      #   gitleaks detect --redact -v --exit-code=2 --report-format=sarif
      #     --report-path=results.sarif --log-level=debug
      #     --log-opts=--no-merges --first-parent <sha>^..<sha>
      #
      # 逐条对照原意与实际:
      #   --config .gitleaks.toml  丢掉,但**碰巧无害** —— gitleaks 会自动发现
      #                            源码根目录下的 .gitleaks.toml(日志可见
      #                            "using existing gitleaks config")。
      #   --redact / --exit-code   丢掉,但 action 自己也传了等价的。
      #   --log-opts=""            丢掉,实际用的是 --no-merges --first-parent。
      #   --no-git                 **丢掉,且这条改变了语义** —— 原意是扫**工作树**,
      #                            实际扫的是**提交区间**。
      #
      # 最后那条有实际操作后果,写在这里免得下一个人再踩:扫的既然是提交区间,
      # 那么"在后续提交里把泄漏的那行删掉"**清不掉这道门** —— 坏行仍在历史某个
      # 提交的 diff 里。必须改写那个提交本身(amend / squash)。
      #
      # 这里保留 action 的默认行为(扫提交区间),因为它其实比原意更严:
      # 提交过又删掉的密钥**依然是泄漏了**,只扫工作树会漏掉这一类。
      # 把失效的 args 删掉,是为了不让配置继续撒谎。
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # C1. Structural guardrail — import boundary enforcement
  # ---------------------------------------------------------------------------
  import-boundaries:
    name: Import Boundary Guardrail
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check import boundaries (strict)
        # 2026-08-31 起转 --strict：存量 70 处越界(core/ → galaxy_gateway/ 53、
        # core/ → enhancements/ 17)已全部改走 core/upper_ports 的端口绑定表。
        # 告警模式留着没有意义 —— 一道永远报警又永远不失败的闸等于没有闸。
        run: |
          python scripts/check_import_boundaries.py --strict
          echo "✅ Import boundary check complete (warning mode)."

  # ---------------------------------------------------------------------------
  # C2. Structural guardrail — file complexity / size budget
  # ---------------------------------------------------------------------------
  file-complexity:
    name: File Complexity Budget
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check file complexity budget (strict mode)
        # Fails CI if any NEW file exceeds 2000 lines, or if a grandfathered
        # file has grown past its recorded limit.
        run: |
          python scripts/check_file_complexity.py --strict

  # ---------------------------------------------------------------------------
  # C2. 证据锚点必须指向真实存在的文件
  #
  # 生产代码里大量模块把「某个文件」写成字符串当论据：完成度评审的 v2_anchors、
  # 边界轴的 code_evidence、债务冻结的豁免名单、复杂度基线的条目。这些字符串没有
  # 任何机制保证指向的东西还在 —— 文件删掉了，评审报告照样"通过"。
  #
  # 这一轮清理死代码时就踩到了：删掉模块后，评审模块仍把它列为「本次已补强」的成果
  # 锚点；复杂度基线里留着已删文件的条目（基线是放宽用的，同名文件重现会白拿高预算）。
  # 还顺带查出三个从未存在过的测试文件名被当作测试证据写了很久。
  #
  # 与 repo-hygiene 里的 check_completion_matrix 同一思路，范围推广到全部生产代码。
  # 只校验能被机器判定的「路径是否存在」；锚点选得对不对是人的判断，不在此校验。
  # ---------------------------------------------------------------------------
  evidence-anchors:
    name: Evidence Anchors Resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 生产代码里的路径证据锚点必须存在
        run: |
          python scripts/check_evidence_anchors.py

  # ---------------------------------------------------------------------------
  # C2b. 可达性：新写的模块必须能从真实入口走到
  #
  # 「这个模块还有人用吗」在本仓被反复手工回答过，每次用一个临时脚本，每次以不同
  # 方式答错。最近一次排查同一份清单先后产生**五类**误报（包 __init__ 未建模、
  # CI 按文件路径调用、漏了 nodes/*/server.py 入口、shim 再导出、workflow 跑硬编码
  # 测试路径），每修一类就冒出新的一类 —— 照最初那份清单删，会一次带走 8 道正在跑的
  # CI 门和 5 个节点服务引擎。
  #
  # 所以把这个判断固化成工具：盲区编码进去、双向反向验证过（造一个死模块必须被抓；
  # 同一个模块被 CI 按路径调用必须不被抓）。
  #
  # 判据是**可达性**不是引用计数 —— 死代码簇会互相引用，按「有没有人 import」永远
  # 删不掉。存量 21 个记在 config/reachability_baseline.json，这道闸只看**新增**：
  # 理由与 wiring / environment-coupling 同一条，新检查一上来就把 CI 弄红只会让人
  # 学会无视它。
  # ---------------------------------------------------------------------------
  reachability:
    name: Reachability (new unreachable core modules)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 纯 AST 静态分析，不 import 任何业务模块，无需装依赖。
      - name: 新增模块必须能从真实入口到达
        run: |
          python scripts/check_reachability.py

  # ---------------------------------------------------------------------------
  # C3. Wiring guardrail — 公开能力有没有调用方
  #
  # 抓的是本仓反复出现的一类缺陷:能力实现完整、单测全绿、文档详尽,但生产代码里
  # **零个调用方**。它不报错、不变慢、不让任何测试变红 —— 它只是不生效。
  # 已确认的一例:DesktopPresenceRuntime.halt_ambient_presence 写完后没有任何
  # 端点去按它,直到补上 core/routes/operator.py 里的入口才真正接上。
  #
  # 存量 676 条记在 config/wiring_baseline.json,这道闸只看**新增**。
  # 先按告警形态跑(不加 --strict):理由与 environment-coupling.yml 里写的同一条 ——
  # 新引入的检查一上来就把 CI 弄红,只会让人学会无视它。等它在主干上稳定攒够几周
  # 零新增,再考虑改成阻塞。
  # ---------------------------------------------------------------------------
  wiring:
    name: Wiring Check (unwired public capabilities)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 纯 AST 静态分析,不 import 任何业务模块,所以不需要装依赖。
      #
      # **为什么带 --strict**:这一步原来不带,于是它只"报告"、从不判失败 ——
      # 而这道闸的全部意义就是拦住新增的"实现了但没有任何调用方"的能力。
      # 实际后果已经出过一次:上一个 PR 引入了 load_anchor(会话摘要跨重启取回),
      # 写侧接了、读侧没接,这道闸**如实报了出来**,但 CI 照样全绿,于是那个功能
      # 带着断掉的一半合了进去 —— 摘要存进磁盘、从来没读出来过,而且不报任何错。
      #
      # 一道只报告不拦截的闸,和它自己要防的那种"接了等于没接"是同一个毛病。
      #
      # --strict 只对**基线之外的新名字**判失败(见 config/wiring_baseline.json 的
      # 说明):存量 763 条一条都不会让 CI 变红,这不是把历史债一次性变成阻塞。
      - name: Check wiring (strict — new unwired capabilities fail the build)
        run: |
          python scripts/check_wiring.py --strict
          echo "✅ Wiring check complete (strict mode: no NEW unwired capabilities)."

  # ---------------------------------------------------------------------------
  # D. Architecture debt-freeze — Batch PR-1 guardrail
  #
  # Detects patterns that represent NEW technical debt being introduced:
  #   1. New root-level placeholder Markdown report files
  #   2. New compatibility shims outside approved legacy zones
  #   3. New inline ``except ImportError`` fallback definitions
  #   4. Oversized YAML files (informational only)
  #
  # Runs in WARNING mode (does not fail CI) until the baseline is clean.
  # Switch to --strict once Batch PR-5 closes out the grandfathered list.
  # ---------------------------------------------------------------------------
  debt-freeze:
    name: Architecture Debt Freeze (Batch PR-1)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run debt-freeze guardrail (warning mode)
        # Warning mode: reports violations but does not fail CI.
        # The output is visible in the workflow log so reviewers can see
        # whether a PR is introducing new debt.
        # Change to --strict in Batch PR-5 after grandfathered list is cleared.
        run: |
          python scripts/check_debt_freeze.py
          echo "✅ Debt-freeze guardrail complete (warning mode)."

  # ---------------------------------------------------------------------------
  # E. Legacy regression guard — PR-8
  #
  # Blocks reintroduction of files that were physically deleted in PR-8:
  #   - windows_client/_legacy/START_CLIENT.bat
  #   - windows_client/_legacy/start_galaxy_client.bat
  #
  # Also rejects new .bat launchers added inside windows_client/ and new
  # Python source files buried in the windows_client/_legacy/ archive zone.
  #
  # Runs in WARNING mode (exit 0 even on violations) so it never blocks a PR
  # that is unrelated to legacy surfaces.  Violations are reported in the
  # workflow log for reviewer awareness.
  # ---------------------------------------------------------------------------
  legacy-regression-guard:
    name: Legacy Regression Guard (PR-8)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run legacy regression guard (warning mode)
        run: |
          python scripts/check_legacy_regression.py --warn-only
          echo "✅ Legacy regression guard complete (warning mode)."

  # ---------------------------------------------------------------------------
  # F. Mainline routing enforcement guard (STRICT — blocking)
  #
  # Verifies that:
  #   1. core.mainline_routing_enforcement module and sentinels are present.
  #   2. The audit function for explicit-device-id capability enforcement works.
  #   3. core/openclawd.py contains the enforcement call site (no silent bypass).
  #   4. Android local AI unavailable-by-default sentinel is present.
  #
  # This job runs in STRICT mode (exit 1 on failure) because it guards the
  # canonical mainline routing enforcement boundary introduced to close the
  # explicit-device-id capability gate bypass gap.
  # ---------------------------------------------------------------------------
  mainline-routing-enforcement:
    name: Mainline Routing Enforcement Guard (STRICT)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install minimal dependencies
        run: |
          pip install pydantic || true

      - name: Run mainline routing enforcement guard (strict mode)
        run: |
          python scripts/check_mainline_routing_enforcement.py
          echo "✅ Mainline routing enforcement guard passed."

  # ---------------------------------------------------------------------------
  # I. 工作流自身 —— Actions 会拒收、而 PyYAML 会放行的那几类写法
  #
  # 起因(2026-08-29):dual_repo_reality_audit.yml 同一步里有两个 env:,
  # 一个在 run: 前、一个在 run: 后。PyYAML 的 safe_load 对重复键是「后者覆盖
  # 前者」,不报错 —— 所以本地怎么验都是绿的;而 Actions 的解析器**拒收整个
  # 文件**,那个工作流从 2026-07-31 起每次推送都 startup_failure:0 个 job、
  # 0 秒、连 name 都读不出来(UI 里显示成文件路径)。整整一个月,一道 blocking
  # 的门挂在那儿一次没执行过,连 android-protected-reality-audit 那条跨仓证据
  # 通道也从没被触发。
  #
  # 它在每条分支上都红,于是这一条红失去了信号意义 —— 谁看都觉得"它一直这样"。
  # 这就是本仓一直在防的那个缺陷长在了 CI 上:看起来接上了,其实没有。
  #
  # 这道门**不是** Actions 的完整 schema 校验器,也做不成一个;它绿不等于工作流
  # 一定能起来。脚本会把没覆盖的部分打印出来,别把它读成"全都验过了"。
  # ---------------------------------------------------------------------------
  workflow-yaml:
    name: Workflow YAML (duplicate keys & structure)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyYAML
        run: pip install PyYAML

      - name: 工作流文件必须是 Actions 也能接受的那种合法
        run: |
          python scripts/check_workflow_yaml.py

      - name: 这道门自己得拦得住(用当初没拦住的那个 bug 验它)
        run: |
          pip install pytest
          python -m pytest tests/test_workflow_yaml_gate.py -q
