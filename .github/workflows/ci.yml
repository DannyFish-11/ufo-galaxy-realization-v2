name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint with flake8
        run: flake8 core/ --max-line-length=120 --count --statistics
      - name: Check formatting with black
        run: black --check core/ tests/
      - name: Check import ordering
        run: isort --check-only core/ tests/

  v3-protocol-guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Ensure no direct aip_protocol_v2 imports outside the deprecated file itself
        run: |
          # Allow the deprecated stub and the guard test; block everything else.
          FORBIDDEN=$(grep -rn "aip_protocol_v2" \
            --include="*.py" \
            --exclude="aip_protocol_v2.py" \
            --exclude="test_v3_protocol_guard.py" \
            galaxy_gateway/ core/ enhancements/ tests/ \
            2>/dev/null || true)
          if [ -n "$FORBIDDEN" ]; then
            echo "❌ Forbidden reference to aip_protocol_v2 detected:"
            echo "$FORBIDDEN"
            exit 1
          fi
          echo "✅ No forbidden aip_protocol_v2 references found."

  s6-compat-smoke:
    # PR-S6: Regression & Compatibility Guardrails smoke suite.
    # Runs on every PR to catch legacy→compat→v3 regressions early.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run S6 compat guardrail smoke suite
        run: |
          python -m pytest -m s6_smoke \
            tests/test_s6_regression_compat_guardrails.py \
            -v --tb=short

  slo-metrics-check:
    # PR-G2: Validate SLO metric endpoint availability and JSON schema.
    # Lightweight check — no network calls, no heavy perf tests.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run SLO metrics unit tests
        run: |
          python -m pytest tests/test_slo_metrics.py -v --tb=short
      - name: Validate Grafana dashboard JSON schema
        run: |
          python - <<'EOF'
          import json, sys

          with open("docs/grafana/slo_dashboard.json") as f:
              dash = json.load(f)

          # Required top-level fields
          for field in ("title", "uid", "panels", "schemaVersion"):
              if field not in dash:
                  print(f"❌ Missing required dashboard field: {field}")
                  sys.exit(1)

          # Verify all expected SLO metric names appear somewhere in panel targets
          required_metrics = [
              "galaxy_slo_startup_duration_ms",
              "galaxy_slo_heartbeat_loss_rate",
              "galaxy_slo_reconnect_attempts_total",
              "galaxy_slo_command_latency_p50_ms",
              "galaxy_slo_command_latency_p95_ms",
          ]
          dashboard_text = json.dumps(dash)
          for metric in required_metrics:
              if metric not in dashboard_text:
                  print(f"❌ Metric not found in dashboard: {metric}")
                  sys.exit(1)

          print(f"✅ Dashboard JSON valid — {len(dash['panels'])} panels, all required metrics present.")
          EOF

  supply-chain-hash-gate:
    # PR-G4: Supply-Chain & Image Security — hash-locked dependency gate.
    # Ensures requirements.hash.txt is present and core packages install
    # cleanly with --require-hashes before any other jobs merge.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install pip-tools
        run: pip install pip-tools
      - name: Assert requirements.hash.txt exists
        run: |
          test -f requirements.hash.txt || {
            echo "❌  requirements.hash.txt missing — run: scripts/pin_deps.sh"
            exit 1
          }
          echo "✅  requirements.hash.txt present."
      - name: Install core deps with --require-hashes
        run: |
          pip install --require-hashes -r requirements.hash.txt
          echo "✅  Hash-verified install of core deps succeeded."
      - name: Run supply-chain unit tests
        run: |
          pip install -r requirements-dev.txt
          python -m pytest tests/test_supply_chain.py -v --tb=short -m "not slow"
          echo "✅  Supply-chain unit tests passed."

  config-preflight-dry-run:
    # PR-G3: Configuration & Secrets Governance.
    # Validates that the pre-flight checker runs cleanly (dry-run) and that
    # all config-governance unit tests pass.  Does NOT require real API keys.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run config preflight (dry-run — no real keys required)
        run: |
          python -m core.config_preflight --mode all --dry-run
      - name: Run config governance unit tests
        run: |
          python -m pytest tests/test_config_preflight.py -v --tb=short

  g7-quick-smoke:
    # PR-G7: Developer Experience & Quick Validation.
    # Fast, non-flaky in-process smoke suite — no live ports, no subprocesses.
    # Validates: VLM stub, Tasker stub, Gateway /health, WS /ws/status,
    #             Makefile targets, quick_verify.sh, QUICKSTART docs.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run G7 smoke suite
        run: |
          python -m pytest -m g7_smoke tests/test_g7_smoke.py \
            -v --tb=short
      - name: Verify Makefile targets exist
        run: |
          grep -E "^\.PHONY.*fmt|^fmt" Makefile
          grep -E "^\.PHONY.*lint|^lint" Makefile
          grep -E "test" Makefile
          grep -E "contract" Makefile
          grep -E "quick-verify" Makefile
          echo "✅ All required Make targets present."
      - name: Verify quick_verify.sh is executable
        run: |
          test -x scripts/quick_verify.sh
          echo "✅ scripts/quick_verify.sh is executable."

  android-runtime-state-e2e:
    # Android → V2 runtime state canonical path evidence.
    # Proves that Android-originated device_state_snapshot travels the full
    # canonical path:
    #   device_register → device_state_snapshot → android_device_state_store
    # AND that the state becomes visible in V2 operator/ecosystem surfaces.
    #
    # Two test modules cooperate:
    #   - tests/integration/test_android_runtime_state_snapshot_e2e.py
    #     (bridge-layer, operator surface, regression guards, handler guards)
    #   - tests/integration/websocket/test_android_snapshot_ws_transport.py
    #     (WebSocket transport-layer: /ws/device/{id} → handler → store)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run Android runtime state e2e tests (bridge layer)
        run: |
          python -m pytest \
            tests/integration/test_android_runtime_state_snapshot_e2e.py \
            -v --tb=short
          echo "✅ Android→V2 bridge-layer e2e tests passed."
      - name: Run Android runtime state e2e tests (WebSocket transport layer)
        run: |
          python -m pytest \
            tests/integration/websocket/test_android_snapshot_ws_transport.py \
            -v --tb=short
          echo "✅ Android→V2 WebSocket transport-layer e2e tests passed."

  conformance-tests:
    # PR-7 Final: AIP v3 envelope, gateway routing, NATS trace, and UDM SSOT
    # conformance tests — must all pass before merging to main.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run conformance suite
        run: |
          python -m pytest tests/conformance/ -v --tb=short
          echo "✅ Conformance suite passed."

  chaos-tests:
    # PR-7 Final: Chaos test suite (disconnect, latency, duplicate message,
    # partial failure) — validates resilience across all U1–U33 paths.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run chaos suite
        run: |
          python -m pytest tests/chaos/ -v --tb=short
          echo "✅ Chaos suite passed."

  ssot-udm-conformance:
    # PR-7 Final: SSOT / UDM conformance — all device state writes must go
    # through UnifiedDeviceManager.  The AST-based audit script is also run
    # to catch any bypass paths that may have been introduced.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run UDM SSOT conformance tests
        run: |
          python -m pytest tests/conformance/test_udm_ssot_conformance.py \
            -v --tb=short
          echo "✅ UDM SSOT conformance tests passed."
      - name: Run UDM write-path audit script
        run: |
          python scripts/audit_udm_write_paths.py
          echo "✅ UDM write-path audit passed."
      - name: Run canonical path audit script
        run: |
          python scripts/audit_unified_paths.py
          echo "✅ Canonical path audit passed."

  system-readiness-check:
    # PR-7 Final: Run the system readiness report generator to verify all
    # U1–U33 artifacts, canonical modules, and CI jobs are in place.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Generate system readiness report
        run: |
          python scripts/generate_system_readiness_report.py --json
          echo "✅ System readiness report generated."
      - name: Run PR7 final consolidation tests
        run: |
          python -m pytest tests/test_pr7_final_consolidation.py -v --tb=short
          echo "✅ PR7 final consolidation tests passed."

  v4-scope-guard:
    # PR-7 V4 Scope Correction: Verify that unified_orchestration_spine is correctly
    # scoped to multi-step orchestration sessions and is NOT wired as a universal
    # per-request gate into OpenClawd or CommandRouter.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run V4 scope correction tests
        run: |
          python -m pytest tests/test_pr7_v4_scope_correction.py -v --tb=short
          echo "✅ V4 orchestration spine scope correction tests passed."
      - name: Verify V4 is absent from per-request hot path
        run: |
          # V4 (unified_orchestration_spine) must NOT be imported by the
          # per-request dispatch files: command_router.py, openclawd.py,
          # or execution_spine.py.  Its correct place is in multi-step
          # orchestration handlers like goal_execution.py.
          FORBIDDEN=$(grep -ln "unified_orchestration_spine" \
            core/command_router.py \
            core/openclawd.py \
            core/execution_spine.py \
            2>/dev/null || true)
          if [ -n "$FORBIDDEN" ]; then
            echo "❌ V4 unified_orchestration_spine found in per-request hot path:"
            echo "$FORBIDDEN"
            echo "V4 must not be a universal per-request gate."
            exit 1
          fi
          echo "✅ V4 correctly absent from per-request hot path (command_router, openclawd, execution_spine)."
      - name: Verify V4 is present in goal_execution.py (legitimate multi-step usage)
        run: |
          # V4 (unified_orchestration_spine) MUST be used by goal_execution.py
          # for PARALLEL_FANOUT multi-step orchestration sessions.
          HANDLER="galaxy_gateway/android/handlers/goal_execution.py"
          if ! grep -q "unified_orchestration_spine" "$HANDLER" 2>/dev/null; then
            echo "❌ V4 unified_orchestration_spine is missing from $HANDLER"
            echo "goal_execution.py must use V4 for PARALLEL_FANOUT multi-step sessions."
            exit 1
          fi
          echo "✅ V4 correctly present in $HANDLER for multi-step orchestration."

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest tests/ -v -m "not slow and not manual"

  test-placement-guard:
    # Structural guardrail: test files must live under tests/, not inside
    # source packages (core/, galaxy_gateway/, nodes/, enhancements/, etc.).
    # Stub redirect files (single-line raise ImportError) are the only allowed
    # exception and must not accumulate new test logic.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check for in-source test files outside tests/
        run: |
          # Find any test_*.py or *_test.py in source directories.
          # ALLOWED PATTERNS:
          #   - Stub redirect files (raise ImportError, no real test logic).
          #   - Files inside a dedicated */tests/ subdirectory within a node or
          #     enhancement (e.g. nodes/Node_71_.../tests/test_*.py).
          # FORBIDDEN:
          #   - Test files with real test logic placed directly in source
          #     packages (e.g. galaxy_gateway/test_foo.py, core/test_bar.py).
          FORBIDDEN=$(
            find core/ galaxy_gateway/ nodes/ enhancements/ dashboard/ launcher/ \
              -name "test_*.py" -o -name "*_test.py" 2>/dev/null \
            | grep -v "/tests/" \
            | xargs grep -l \
                -e "^def test_" \
                -e "^class Test" \
                -e "^import pytest" \
                -e "^from pytest" \
              2>/dev/null || true
          )
          if [ -n "$FORBIDDEN" ]; then
            echo "❌ In-source test files with real test logic detected:"
            echo "$FORBIDDEN"
            echo ""
            echo "Move these files to tests/integration/ (or tests/unit/)."
            echo "See tests/README.md for the test layout policy."
            exit 1
          fi
          echo "✅ No in-source test files with real test logic found."

  governance-verdict-blocking:
    # PR-CI-BLOCK: Governance / Readiness Verdict CI Blocking Gate.
    # Runs the governance validation gate in blocking mode.  A verdict of
    # FAIL (governance blocked, readiness blocked, or delegated readiness
    # not-ready) causes this job to exit non-zero, preventing merge to main.
    #
    # Blocking dimensions (exit 1):
    #   - governance_blocked          (distributed release gate returned blocked)
    #   - readiness_blocked           (ExecutionReadinessGate returned BLOCKED)
    #   - delegated_readiness_not_ready (DelegatedFlowReadinessGate not ready)
    #
    # Advisory dimensions (exit 0, surfaced in artifact only):
    #   - evidence_surface_unavailable
    #   - capability_tier_experimental
    #   - capability_tier_quasi_main_chain
    #
    # The --delegated flag enables DelegatedFlowReadinessGate evaluation so
    # that a delegated_readiness_not_ready verdict becomes a hard CI block.
    # If the gate module is unavailable the flag is silently a no-op.
    #
    # The JSON verdict is uploaded as a workflow artifact for downstream
    # tooling and release pipeline consumption.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run governance verdict CI gate (blocking on FAIL)
        run: |
          python core/governance_validation_gate.py \
            --output governance_verdict.json \
            --delegated
          echo "✅ Governance verdict gate: APPROVED."
      - name: Validate verdict JSON schema
        run: |
          python - <<'EOF'
          import json
          import sys

          with open("governance_verdict.json") as f:
              v = json.load(f)

          required_keys = [
              "result_id", "generated_at", "outcome", "fail_reasons",
              "summary", "release_gate_verdict", "readiness_status",
              "delegated_readiness_verdict", "blocked_gate_worthy_count",
              "ci_blocking_dimensions", "ci_advisory_dimensions",
              "blocking_fail_reasons", "advisory_fail_reasons",
          ]
          missing = [k for k in required_keys if k not in v]
          if missing:
              print(f"❌ Verdict JSON missing required keys: {missing}")
              sys.exit(1)

          valid_outcomes = {"pass", "warn", "fail"}
          if v["outcome"] not in valid_outcomes:
              print(f"❌ Invalid outcome value: {v['outcome']!r}")
              sys.exit(1)

          print(f"✅ Verdict JSON schema valid — outcome={v['outcome']!r}  "
                f"blocking_reasons={v['blocking_fail_reasons']}")
          EOF
      - name: Upload governance verdict artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-verdict
          path: governance_verdict.json
          retention-days: 30
      - name: Run governance CI blocking tests
        run: |
          python -m pytest tests/test_pr_governance_ci_blocking.py \
            -v --tb=short
          echo "✅ Governance CI blocking tests passed."
      - name: Run release blocking gate tests
        run: |
          python -m pytest tests/test_release_blocking_gate.py \
            -v --tb=short
          echo "✅ Release blocking gate tests passed."