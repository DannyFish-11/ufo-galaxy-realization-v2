# ============================================================
# Galaxy — Production Docker Compose
# 24/7 continuous operation with monitoring stack
#
# SURFACE ROLE: Canonical production surface
# See docs/DEPLOYMENT_SURFACES.md for the full surface catalogue.
#
# Usage:
#   docker compose -f docker-compose.production.yml up -d
#   docker compose -f docker-compose.production.yml logs -f galaxy
# ============================================================

services:
  # ── Core: Galaxy Main Service ──
  galaxy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: galaxy
    restart: unless-stopped

    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 1G
      restart_policy:
        condition: any
        delay: 10s
        max_attempts: 20
        window: 60s

    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    env_file: .env
    environment:
      - GALAXY_MODE=production
      - GALAXY_LOG_LEVEL=INFO
      - PYTHONUNBUFFERED=1

    ports:
      - "9000:9000"   # Main API + Web UI (灵动岛 Dashboard) — single client entry port

    volumes:
      - galaxy-data:/app/data
      - galaxy-logs:/app/logs
      - ./config:/app/config:ro

    networks:
      - galaxy-net

    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"

  # ── Gateway: Lightweight API Proxy ──
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: galaxy-gateway
    restart: unless-stopped

    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    env_file: .env
    environment:
      - GALAXY_MODE=production
      - GALAXY_UPSTREAM=http://galaxy:9000

    ports:
      - "9000:9000"

    volumes:
      - galaxy-logs:/app/logs
      - ./config:/app/config:ro

    networks:
      - galaxy-net

    depends_on:
      galaxy:
        condition: service_healthy

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ── Dashboard: Secondary Web UI ──
  # NOTE: Port 8001 is intentional — this secondary management dashboard cannot
  # use port 9000 because the primary galaxy service already binds that port.
  # All primary API/client traffic must go through galaxy:9000 (or gateway:9000).
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: galaxy-dashboard
    restart: unless-stopped
    command: ["python", "start_galaxy.py", "--port", "8001"]

    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    env_file: .env

    ports:
      - "8001:8001"

    volumes:
      - galaxy-data:/app/data:ro
      - galaxy-logs:/app/logs
      - ./config:/app/config:ro

    networks:
      - galaxy-net

    depends_on:
      galaxy:
        condition: service_healthy

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ── Watchdog: 24/7 Process Guardian ──
  watchdog:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: galaxy-watchdog
    restart: unless-stopped
    command: ["python", "-m", "daemon.galaxy_daemon"]

    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

    env_file: .env
    environment:
      - WATCHDOG_MODE=production
      - HEALTH_CHECK_INTERVAL=30
      - AUTO_RESTART=true
      - GALAXY_HEALTH_URL=http://galaxy:9000/health/live

    volumes:
      - galaxy-logs:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./daemon/config.json:/app/daemon/config.json:ro

    networks:
      - galaxy-net

    depends_on:
      galaxy:
        condition: service_healthy

    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # ── Monitoring: Prometheus ──
  prometheus:
    image: prom/prometheus:latest
    container_name: galaxy-prometheus
    restart: unless-stopped

    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'

    ports:
      - "9090:9090"

    volumes:
      - prometheus-data:/prometheus
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro

    networks:
      - galaxy-net

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ── Monitoring: Grafana Dashboard ──
  grafana:
    image: grafana/grafana:latest
    container_name: galaxy-grafana
    restart: unless-stopped

    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000

    ports:
      - "3000:3000"

    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana:/etc/grafana/provisioning:ro

    networks:
      - galaxy-net

    depends_on:
      - prometheus

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ── Log Aggregator: Fluent Bit ──
  fluent-bit:
    image: fluent/fluent-bit:latest
    container_name: galaxy-logs
    restart: unless-stopped

    volumes:
      - galaxy-logs:/logs:ro
      - ./config/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro

    networks:
      - galaxy-net

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ── Volumes ──
volumes:
  galaxy-data:
    driver: local
  galaxy-logs:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

# ── Network ──
networks:
  galaxy-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
