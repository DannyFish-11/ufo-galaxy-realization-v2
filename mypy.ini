# mypy configuration — pragmatic gradual-typing baseline
# Run locally: mypy --config-file mypy.ini core/ galaxy_gateway/

[mypy]
python_version = 3.11
warn_return_any = False
warn_unused_configs = True
ignore_missing_imports = True
no_implicit_optional = True
strict_optional = True
# Start with error-free mode: report issues but don't block CI on every module
# Use per-module overrides below to tighten gradually.
follow_imports = silent
show_error_codes = True
pretty = True

# ── Gradual adoption: new / recently refactored modules are checked strictly ──

[mypy-core.canonical_execution_chain]
ignore_errors = False

[mypy-core.mainline_convergence]
ignore_errors = False

[mypy-galaxy_gateway.routing.*]
ignore_errors = False

# ── Legacy / generated / third-party stubs: silence entirely ──

[mypy-core.openclawd]
ignore_errors = True

[mypy-core.api_routes]
ignore_errors = True

[mypy-nodes.*]
ignore_errors = True

[mypy-enhancements.*]
ignore_errors = True

[mypy-dashboard.*]
ignore_errors = True
