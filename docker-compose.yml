# ============================================================
# Galaxy — Development Docker Compose
#
# SURFACE ROLE: Canonical development surface
# See docs/DEPLOYMENT_SURFACES.md for the full surface catalogue.
# ============================================================
#
# Usage:
#   docker compose up -d                  # Core services
#   docker compose --profile full up -d   # All services
#
# Services:
#   galaxy          — Main Galaxy application (API + scheduler)
#   galaxy-gateway  — Lightweight API gateway (primary client entry)
#   neo4j           — Graph database (MemOS memory system)
#   qdrant          — Vector database (semantic search)
#   redis           — Cache & message broker
#   mongodb         — Document storage
#   ollama          — Local LLM serving
#   coturn          — WebRTC TURN server [profile: full]
#   minio           — Object storage [profile: full]
#   oneapi          — LLM API gateway [profile: full]
#   memos           — MemOS memory system [profile: full]
#   nats            — JetStream message bus
#   temporal        — Workflow engine [profile: full]
#   temporal-db     — PostgreSQL backend for Temporal [profile: full]
#   temporal-ui     — Temporal Web UI [profile: full]
#   galaxy-worker   — Go Edge Worker [profile: worker]
#   agentcpm        — AgentCPM-GUI inference [profile: full]

services:
  # ============ Galaxy Main Application ============
  # Core API server + scheduler. Depends on all data stores.
  galaxy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: galaxy
    expose:
      - "9000"
    env_file: .env
    environment:
      - "GALAXY_MODE=development"
      - "GALAXY_LOG_LEVEL=DEBUG"
      - "PYTHONUNBUFFERED=1"
      - "OLLAMA_MODEL=${OLLAMA_MODEL:-gemma4:latest}"
      - "NEO4J_URI=bolt://neo4j:7687"
      - "QDRANT_URL=http://qdrant:6333"
      - "REDIS_URL=redis://redis:6379"
      - "MONGODB_URI=mongodb://${MONGODB_USER:-mongoadmin}:${MONGODB_PASSWORD:-mongoadmin123}@mongodb:27017"
      - "OLLAMA_URL=http://ollama:11434"
      - "GALAXY_NATS_URL=nats://nats:4222"
      - "GALAXY_TEMPORAL_URL=temporal:7233"
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      nats:
        condition: service_healthy
      ollama:
        condition: service_started
    volumes:
      - ./core:/app/core
      - ./config:/app/config
      - ./nodes:/app/nodes
      - galaxy-data:/app/data
      - galaxy-logs:/app/logs
    networks:
      - galaxy-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/health/live"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ============ Galaxy Gateway — Primary Client Entry (port 9000) ============
  # All clients (Windows, Android, Dashboard) connect to this service.
  # Single source-of-truth API base: http://<host>:9000
  galaxy-gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: galaxy-gateway
    ports:
      - "9000:9000"
    environment:
      # OneAPI configuration (recommended)
      - "ONEAPI_URL=${ONEAPI_URL:-}"
      - "ONEAPI_API_KEY=${ONEAPI_API_KEY:-}"

      # Direct API Keys (fallback) — 2026-05-29: 14 providers
      - "OPENAI_API_KEY=${OPENAI_API_KEY:-}"
      - "OPENAI_API_BASE=${OPENAI_API_BASE:-https://api.openai.com/v1}"
      - "OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}"
      - "ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}"
      - "GEMINI_API_KEY=${GEMINI_API_KEY:-}"
      - "DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}"
      - "GROQ_API_KEY=${GROQ_API_KEY:-}"
      - "XAI_API_KEY=${XAI_API_KEY:-}"
      # Domestic providers (added 2026-05-29)
      - "QWEN_API_KEY=${QWEN_API_KEY:-}"
      - "ZHIPU_API_KEY=${ZHIPU_API_KEY:-}"
      - "MINIMAX_API_KEY=${MINIMAX_API_KEY:-}"
      - "STEP_API_KEY=${STEP_API_KEY:-}"
      - "MIMO_API_KEY=${MIMO_API_KEY:-}"

      # Local models
      - "OLLAMA_URL=${OLLAMA_URL:-http://ollama:11434}"
      - "VLLM_URL=${VLLM_URL:-}"

      # Neo4j configuration
      - "NEO4J_URI=${NEO4J_URI:-bolt://neo4j:7687}"
      - "NEO4J_USER=${NEO4J_USER:-neo4j}"
      - "NEO4J_PASSWORD=${NEO4J_PASSWORD:-neo4j123}"

      # Qdrant configuration
      - "QDRANT_URL=${QDRANT_URL:-http://qdrant:6333}"
      - "QDRANT_API_KEY=${QDRANT_API_KEY:-}"

      # WebRTC configuration
      - "STUN_SERVERS=${STUN_SERVERS:-stun:stun.l.google.com:19302,stun:stun1.l.google.com:19302}"
      - "TURN_SERVER=${TURN_SERVER:-}"
      - "TURN_USERNAME=${TURN_USERNAME:-}"
      - "TURN_CREDENTIAL=${TURN_CREDENTIAL:-}"

      # MinIO configuration
      - "MINIO_ENDPOINT=${MINIO_ENDPOINT:-minio:9000}"
      - "MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}"
      - "MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin123}"
      - "MINIO_BUCKET=${MINIO_BUCKET:-galaxy}"

      # MongoDB configuration
      - "MONGODB_URI=${MONGODB_URI:-mongodb://mongodb:27017}"
      - "MONGODB_DB=${MONGODB_DB:-galaxy}"

    depends_on:
      ollama:
        condition: service_started
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - galaxy-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============ Neo4j Graph Database (MemOS memory system) ============
  neo4j:
    image: neo4j:5.15-community
    container_name: neo4j
    ports:
      - "7474:7474"  # HTTP Browser
      - "7687:7687"  # Bolt Protocol
    environment:
      - "NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-neo4j123}"
      - "NEO4J_PLUGINS=[\"apoc\", \"gds\"]"  # APOC and Graph Data Science plugins
      - "NEO4J_dbms_memory_heap_initial__size=512m"
      - "NEO4J_dbms_memory_heap_max__size=2G"
      - "NEO4J_dbms_memory_pagecache_size=1G"
      - "NEO4J_dbms_security_procedures_unrestricted=apoc.*,gds.*"
      - "NEO4J_apoc_export_file_enabled=true"
      - "NEO4J_apoc_import_file_enabled=true"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
      - neo4j-import:/var/lib/neo4j/import
      - neo4j-plugins:/plugins
    networks:
      - galaxy-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
        reservations:
          cpus: "0.5"
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7474"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ============ Qdrant Vector Database ============
  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: qdrant
    ports:
      - "6333:6333"       # REST API
      - "6334:6334"       # gRPC
    environment:
      - "QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY:-}"
      - "QDRANT__SERVICE__ENABLE_CORS=true"
      - "QDRANT__STORAGE__STORAGE_PATH=/qdrant/storage"
      - "QDRANT__STORAGE__SNAPSHOTS_PATH=/qdrant/snapshots"
      - "QDRANT__TELEMETRY_DISABLED=true"
    volumes:
      - qdrant-storage:/qdrant/storage
      - qdrant-snapshots:/qdrant/snapshots
    networks:
      - galaxy-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
        reservations:
          cpus: "0.25"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ============ Coturn TURN Server (WebRTC) ============
  coturn:
    image: coturn/coturn:4.6.2
    container_name: coturn
    ports:
      - "3478:3478"       # STUN/TURN
      - "3478:3478/udp"
      - "5349:5349"       # STUN/TURN TLS
      - "5349:5349/udp"
      # SECURITY: Full 49152-65535 UDP port range (16384 ports) is a DoS risk.
      # Use host network mode for production: network_mode: host (remove ports section).
      # Or restrict to a smaller range (e.g., 5000 ports max) for development.
      - "49152-54151:49152-54151/udp"  # Relay ports (5000 ports for dev)
    environment:
      - "TURN_REALM=${TURN_REALM:-galaxy.local}"
      - "TURN_USER=${TURN_USERNAME:-galaxy}"
      - "TURN_PASSWORD=${TURN_CREDENTIAL:-galaxy123}"
      - "TURN_MIN_PORT=49152"
      - "TURN_MAX_PORT=54151"
    command: >
      -n -v
      --realm=${TURN_REALM:-galaxy.local}
      --fingerprint
      --lt-cred-mech
      --user=${TURN_USERNAME:-galaxy}:${TURN_CREDENTIAL:-galaxy123}
      --external-ip=${EXTERNAL_IP:-$(detect-external-ip)}
      --listening-port=3478
      --tls-listening-port=5349
      --min-port=49152
      --max-port=54151
      --log-file=stdout
      --no-cli
    networks:
      - galaxy-network
    restart: unless-stopped
    profiles:
      - full
      - webrtc
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # ============ MinIO Object Storage ============
  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: minio
    ports:
      - "9002:9000"       # API (host 9002 to avoid conflict with Gateway)
      - "9001:9001"       # Console
    environment:
      - "MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-minioadmin}"
      - "MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:-minioadmin123}"
      - "MINIO_BROWSER_REDIRECT_URL=${MINIO_BROWSER_URL:-http://localhost:9001}"
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - galaxy-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============ OneAPI Unified Gateway (optional) ============
  oneapi:
    image: justsong/one-api:latest
    container_name: oneapi
    ports:
      - "3001:3000"
    environment:
      - "SQL_DSN=${ONEAPI_SQL_DSN:-}"
      - "REDIS_CONN_STRING=${ONEAPI_REDIS:-}"
      - "SESSION_SECRET=${ONEAPI_SESSION_SECRET:-galaxy-secret}"
      - "TZ=Asia/Shanghai"
    volumes:
      - oneapi-data:/data
    networks:
      - galaxy-network
    restart: unless-stopped
    profiles:
      - full
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # ============ Ollama Local Model Serving ============
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - galaxy-network
    restart: unless-stopped
    profiles:
      - gpu
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 8G
        reservations:
          cpus: "1.0"
          memory: 2G
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "3"

  # ============ MemOS Memory System (optional) ============
  memos:
    image: memtensor/memos:latest
    container_name: memos
    ports:
      - "8180:8080"
    environment:
      - "REDIS_URL=redis://redis:6379"
      - "NEO4J_URI=bolt://neo4j:7687"
      - "NEO4J_USER=${NEO4J_USER:-neo4j}"
      - "NEO4J_PASSWORD=${NEO4J_PASSWORD:-neo4j123}"
      - "QDRANT_URL=http://qdrant:6333"
    volumes:
      - memos-data:/data
    depends_on:
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - galaxy-network
    restart: unless-stopped
    profiles:
      - full
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # ============ NATS JetStream (Agentic OS Message Bus) ============
  nats:
    image: nats:2.10-alpine
    container_name: nats
    command: ["--jetstream", "--store_dir=/data", "--http_port=8222"]
    ports:
      - "4222:4222"   # Client port
      - "8222:8222"   # Monitoring port
    volumes:
      - nats-data:/data
    networks:
      - galaxy-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ============ Temporal (Agentic OS Workflow Engine) ============
  temporal:
    image: temporalio/auto-setup:1.24
    container_name: temporal
    ports:
      - "7233:7233"   # gRPC port
    environment:
      - "DB=postgresql"
      - "DB_PORT=5432"
      - "POSTGRES_USER=temporal"
      - "POSTGRES_PWD=temporal"
      - "POSTGRES_SEEDS=temporal-db"
    depends_on:
      temporal-db:
        condition: service_healthy
    networks:
      - galaxy-network
    restart: unless-stopped
    profiles:
      - full
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "tctl --address temporal:7233 namespace list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  temporal-db:
    image: postgres:15-alpine
    container_name: temporal-db
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    volumes:
      - temporal-db-data:/var/lib/postgresql/data
    networks:
      - galaxy-network
    restart: unless-stopped
    profiles:
      - full
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 10s
      timeout: 5s
      retries: 5

  temporal-ui:
    image: temporalio/ui:2.31
    container_name: temporal-ui
    ports:
      - "8233:8080"
    environment:
      - "TEMPORAL_ADDRESS=temporal:7233"
    depends_on:
      - temporal
    networks:
      - galaxy-network
    restart: unless-stopped
    profiles:
      - full
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # ============ Go Edge Worker (Agentic OS Data Plane) ============
  galaxy-worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: galaxy-worker
    environment:
      - "GALAXY_NATS_URL=nats://nats:4222"
      - "GALAXY_WORKER_ID=worker-docker-01"
      - "GALAXY_WORKER_TYPE=linux"
      - "GALAXY_WORKER_PORT=8300"
    ports:
      - "8300:8300"
    depends_on:
      nats:
        condition: service_healthy
    networks:
      - galaxy-network
    restart: unless-stopped
    profiles:
      - worker
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8300/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ============ Redis Cache & Message Broker ============
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - galaxy-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ============ MongoDB Document Storage ============
  mongodb:
    image: mongo:7
    container_name: mongodb
    ports:
      - "27017:27017"
    environment:
      - "MONGO_INITDB_ROOT_USERNAME=${MONGODB_USER:-mongoadmin}"
      - "MONGO_INITDB_ROOT_PASSWORD=${MONGODB_PASSWORD:-mongoadmin123}"
      - "MONGO_INITDB_DATABASE=${MONGODB_DB:-galaxy}"
    volumes:
      - mongo-data:/data/db
    networks:
      - galaxy-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ============ AgentCPM-GUI Inference Service ============
  agentcpm:
    build:
      context: .
      dockerfile: Dockerfile.agentcpm
    container_name: agentcpm
    ports:
      - "8401:8001"
    environment:
      - "MODEL_PATH=/models/AgentCPM-GVI"
    volumes:
      - agentcpm-models:/models
    networks:
      - galaxy-network
    restart: unless-stopped
    profiles:
      - full
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
        reservations:
          cpus: "1.0"
          memory: 1G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  galaxy-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  # Neo4j
  neo4j-data:
  neo4j-logs:
  neo4j-import:
  neo4j-plugins:

  # Qdrant
  qdrant-storage:
  qdrant-snapshots:

  # MinIO
  minio-data:

  # Ollama
  ollama-models:

  # OneAPI
  oneapi-data:

  # NATS
  nats-data:

  # MemOS
  memos-data:

  # Temporal
  temporal-db-data:

  # Redis
  redis-data:

  # MongoDB
  mongo-data:

  # Galaxy app
  galaxy-data:
  galaxy-logs:

  # AgentCPM
  agentcpm-models:
