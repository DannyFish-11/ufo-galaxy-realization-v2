# ============================================================
# Galaxy — Development Docker Compose
#
# SURFACE ROLE: Canonical development surface
# See docs/DEPLOYMENT_SURFACES.md for the full surface catalogue.
# ============================================================
#
# Usage:
#   docker compose up -d                  # Core services
#   docker compose --profile full up -d   # All services
#
# Services:
#   galaxy        — Main Galaxy application (API + scheduler)
#   galaxy-gateway   — Lightweight API gateway
#   neo4j         — Graph database (MemOS)
#   qdrant        — Vector database (semantic search)
#   redis         — Cache & message broker
#   mongodb       — Document storage
#   ollama        — Local LLM serving
#   coturn        — WebRTC TURN server [profile: full]
#   minio         — Object storage [profile: full]
#   oneapi        — LLM API gateway [profile: full]
#   memos         — MemOS memory system [profile: full]
#   agentcpm      — AgentCPM-GUI [profile: full]
#
# ── 凭据约定（B4 / B5 修复）──────────────────────────────────────────────
# 本文件不再内置任何可猜的默认密码。凭据分两类处理，差异来自 Compose 的
# 一个硬性行为：**插值发生在整份文件上，与 profile 无关** —— 即使某服务
# 不在当前 profile 里，它的 ${VAR:?} 依然会让 `docker compose up` 失败
# （已实测确认）。因此：
#
#   1) 常驻服务（galaxy / galaxy-gateway / neo4j / minio / mongodb …）
#      的密钥用 ${VAR:?...} —— 未设置就直接拒绝启动。这些服务默认就要跑，
#      强制设置是正确的强迫函数。
#
#   2) profile 服务（coturn / oneapi / temporal-db / memos …）的密钥留空
#      默认 ${VAR:-}。留空而不是 ${VAR:?}，是为了不让「我根本没启用这个
#      profile」的用户被迫去设一个用不到的密钥；留空而不是保留弱默认，
#      是为了让该服务在**真被启用时**因缺密钥而启动失败，
#      而不是静默地用 galaxy123 / temporal 这种可猜的值跑起来。
#
# 用户名/access key 一类的标识符（neo4j / minioadmin / galaxy）保留默认值 ——
# 它们本身不是密钥，单独泄露无意义，强制设置只增加摩擦。
#
# 首次使用：cp .env.example .env，然后把 change_me_before_production 全部改掉。
# ────────────────────────────────────────────────────────────────────────

services:
  # ============ Galaxy Main Application ============
  galaxy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: galaxy
    expose:
      - "9000"
    env_file: .env
    environment:
      - GALAXY_MODE=development
      - GALAXY_LOG_LEVEL=DEBUG
      - PYTHONUNBUFFERED=1
      - OLLAMA_MODEL=${OLLAMA_MODEL:-gemma4:latest}
      - NEO4J_URI=bolt://neo4j:7687
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379
      # B4: 此处曾硬编码 mongodb://mongoadmin:mongoadmin123@mongodb:27017 ——
      # 没有 ${...} 包装，用户改不掉（对比下方 galaxy-gateway 同名变量本来就是
      # 可覆盖的，可见是遗漏而非设计）。凭据随镜像环境、docker inspect、日志外泄。
      - MONGODB_URI=${MONGODB_URI:?MONGODB_URI 必须设置（见 .env.example，需含 mongodb 的用户名/密码）}
      - OLLAMA_URL=http://ollama:11434
      - GALAXY_NATS_URL=nats://nats:4222
      - GALAXY_TEMPORAL_URL=temporal:7233
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    volumes:
      - ./core:/app/core
      - ./config:/app/config
      - ./nodes:/app/nodes
      - galaxy-data:/app/data
      - galaxy-logs:/app/logs
    networks:
      - galaxy-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/health/live"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ============ Galaxy Gateway — Primary Client Entry (port 9000) ============
  # All clients (Windows, Android, Dashboard) should connect to this service.
  # Single source-of-truth API base: http://<host>:9000
  galaxy-gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: galaxy-gateway
    ports:
      - "9000:9000"
    environment:
      # OneAPI 配置 (推荐)
      - ONEAPI_URL=${ONEAPI_URL:-}
      - ONEAPI_API_KEY=${ONEAPI_API_KEY:-}

      # 直连 API Keys (备用) — 2026-05-29: 14个提供商
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_API_BASE=${OPENAI_API_BASE:-https://api.openai.com/v1}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - XAI_API_KEY=${XAI_API_KEY:-}
      # 国产提供商 (2026-05-29新增)
      - QWEN_API_KEY=${QWEN_API_KEY:-}
      - ZHIPU_API_KEY=${ZHIPU_API_KEY:-}
      - MINIMAX_API_KEY=${MINIMAX_API_KEY:-}
      - STEP_API_KEY=${STEP_API_KEY:-}
      - MIMO_API_KEY=${MIMO_API_KEY:-}

      # 本地模型
      - OLLAMA_URL=${OLLAMA_URL:-http://ollama:11434}
      - VLLM_URL=${VLLM_URL:-}

      # Neo4j 配置
      - NEO4J_URI=${NEO4J_URI:-bolt://neo4j:7687}
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:?NEO4J_PASSWORD 必须设置（见 .env.example）}

      # Qdrant 配置
      - QDRANT_URL=${QDRANT_URL:-http://qdrant:6333}
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}

      # WebRTC 配置
      - STUN_SERVERS=${STUN_SERVERS:-stun:stun.l.google.com:19302,stun:stun1.l.google.com:19302}
      - TURN_SERVER=${TURN_SERVER:-}
      - TURN_USERNAME=${TURN_USERNAME:-}
      - TURN_CREDENTIAL=${TURN_CREDENTIAL:-}

      # MinIO 配置
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-minio:9000}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:?MINIO_SECRET_KEY 必须设置（见 .env.example）}
      - MINIO_BUCKET=${MINIO_BUCKET:-galaxy}

      # MongoDB 配置
      # 与 galaxy 服务同源。此前这里的默认值是无凭据的 mongodb://mongodb:27017，
      # 而 mongodb 服务本身是带 root 账号起的 —— 两边语义不一致。
      - MONGODB_URI=${MONGODB_URI:?MONGODB_URI 必须设置（见 .env.example，需含 mongodb 的用户名/密码）}
      - MONGODB_DB=${MONGODB_DB:-galaxy}

    depends_on:
      ollama:
        condition: service_started
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - galaxy-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============ Neo4j 图数据库 (MemOS 记忆系统) ============
  neo4j:
    image: neo4j:5.15-community
    container_name: neo4j
    ports:
      - "7474:7474"  # HTTP Browser
      - "7687:7687"  # Bolt Protocol
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?NEO4J_PASSWORD 必须设置（见 .env.example）}
      - NEO4J_PLUGINS=["apoc", "gds"]  # APOC 和 Graph Data Science 插件
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=2G
      - NEO4J_dbms_memory_pagecache_size=1G
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*,gds.*
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
      - neo4j-import:/var/lib/neo4j/import
      - neo4j-plugins:/plugins
    networks:
      - galaxy-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7474"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ============ Qdrant 向量数据库 ============
  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: qdrant
    ports:
      - "6333:6333"       # REST API
      - "6334:6334"       # gRPC
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY:-}
      - QDRANT__SERVICE__ENABLE_CORS=true
      - QDRANT__STORAGE__STORAGE_PATH=/qdrant/storage
      - QDRANT__STORAGE__SNAPSHOTS_PATH=/qdrant/snapshots
      - QDRANT__TELEMETRY_DISABLED=true
    volumes:
      - qdrant-storage:/qdrant/storage
      - qdrant-snapshots:/qdrant/snapshots
    networks:
      - galaxy-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ============ Coturn TURN 服务器 (WebRTC) ============
  coturn:
    image: coturn/coturn:4.6.2
    container_name: coturn
    ports:
      - "3478:3478"       # STUN/TURN
      - "3478:3478/udp"
      - "5349:5349"       # STUN/TURN TLS
      - "5349:5349/udp"
      - "49152-65535:49152-65535/udp"  # Relay ports
    environment:
      - TURN_REALM=${TURN_REALM:-galaxy.local}
      - TURN_USER=${TURN_USERNAME:-galaxy}
      # profile 服务：留空而非 ${VAR:?}（否则不启用 turn 的用户也会被卡住），
      # 也不再保留 galaxy123 —— 空凭据会让 coturn 起不来，而弱默认会让它静默跑起来。
      - TURN_PASSWORD=${TURN_CREDENTIAL:-}
      - TURN_MIN_PORT=49152
      - TURN_MAX_PORT=65535
    command: >
      -n -v
      --realm=${TURN_REALM:-galaxy.local}
      --fingerprint
      --lt-cred-mech
      --user=${TURN_USERNAME:-galaxy}:${TURN_CREDENTIAL:-}
      --external-ip=${EXTERNAL_IP:-$(detect-external-ip)}
      --listening-port=3478
      --tls-listening-port=5349
      --min-port=49152
      --max-port=65535
      --log-file=stdout
      --no-cli
    networks:
      - galaxy-network
    restart: unless-stopped
    profiles:
      - full
      - webrtc

  # ============ MinIO 对象存储 ============
  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: minio
    ports:
      - "9002:9000"       # API (host 9002 to avoid conflict with Gateway)
      - "9001:9001"       # Console
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:?MINIO_SECRET_KEY 必须设置（见 .env.example）}
      - MINIO_BROWSER_REDIRECT_URL=${MINIO_BROWSER_URL:-http://localhost:9001}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - galaxy-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============ OneAPI 统一网关 (可选) ============
  oneapi:
    image: justsong/one-api:latest
    container_name: oneapi
    ports:
      - "3001:3000"
    environment:
      - SQL_DSN=${ONEAPI_SQL_DSN:-}
      - REDIS_CONN_STRING=${ONEAPI_REDIS:-}
      # profile 服务：去掉 galaxy-secret 弱默认（会话签名密钥可猜 = 会话可伪造）。
      - SESSION_SECRET=${ONEAPI_SESSION_SECRET:-}
      - TZ=Asia/Shanghai
    volumes:
      - oneapi-data:/data
    networks:
      - galaxy-network
    restart: unless-stopped
    profiles:
      - full

  # ============ Ollama 本地模型 ============
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - galaxy-network
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ============ MemOS 记忆系统 (可选) ============
  memos:
    image: memtensor/memos:latest
    container_name: memos
    ports:
      - "8180:8080"
    environment:
      - REDIS_URL=redis://redis:6379
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:?NEO4J_PASSWORD 必须设置（见 .env.example）}
      - QDRANT_URL=http://qdrant:6333
    volumes:
      - memos-data:/data
    depends_on:
      - redis
      - neo4j
      - qdrant
    networks:
      - galaxy-network
    restart: unless-stopped
    profiles:
      - full

  # ============ NATS JetStream (Agentic OS Message Bus) ============
  nats:
    image: nats:2.10-alpine
    container_name: nats
    command: ["--jetstream", "--store_dir=/data", "--http_port=8222"]
    ports:
      - "4222:4222"   # Client
      - "8222:8222"   # Monitoring
    volumes:
      - nats-data:/data
    networks:
      - galaxy-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ============ Temporal (Agentic OS Workflow Engine) ============
  temporal:
    image: temporalio/auto-setup:1.24
    container_name: temporal
    ports:
      - "7233:7233"   # gRPC
    environment:
      - DB=postgresql
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      # 必须与 temporal-db 的 POSTGRES_PASSWORD 同源，否则 auto-setup 连不上。
      - POSTGRES_PWD=${POSTGRES_PASSWORD:-}
      - POSTGRES_SEEDS=temporal-db
    depends_on:
      temporal-db:
        condition: service_healthy
    networks:
      - galaxy-network
    restart: unless-stopped
    profiles:
      - full

  temporal-db:
    image: postgres:15-alpine
    container_name: temporal-db
    environment:
      POSTGRES_USER: temporal
      # profile 服务：此前是纯硬编码 `temporal`，连 ${} 都没有。留空后
      # postgres 镜像会因缺 POSTGRES_PASSWORD 直接拒绝启动（fail-closed）。
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - temporal-db-data:/var/lib/postgresql/data
    networks:
      - galaxy-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - full

  temporal-ui:
    image: temporalio/ui:2.31
    container_name: temporal-ui
    ports:
      - "8233:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    depends_on:
      - temporal
    networks:
      - galaxy-network
    restart: unless-stopped
    profiles:
      - full

  # ============ Go Edge Worker (Agentic OS Data Plane) ============
  galaxy-worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: galaxy-worker
    environment:
      - GALAXY_NATS_URL=nats://nats:4222
      - GALAXY_WORKER_ID=worker-docker-01
      - GALAXY_WORKER_TYPE=linux
      - GALAXY_WORKER_PORT=8300
    ports:
      - "8300:8300"
    depends_on:
      nats:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - galaxy-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8300/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    profiles:
      - worker

  # ============ Redis ============
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - galaxy-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ============ MongoDB ============
  mongodb:
    image: mongo:7
    container_name: mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGODB_USER:-mongoadmin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGODB_PASSWORD:?MONGODB_PASSWORD 必须设置（见 .env.example）}
      - MONGO_INITDB_DATABASE=${MONGODB_DB:-galaxy}
    volumes:
      - mongo-data:/data/db
    networks:
      - galaxy-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ============ AgentCPM-GUI ============
  agentcpm:
    build:
      context: .
      dockerfile: Dockerfile.agentcpm
    container_name: agentcpm
    ports:
      - "8401:8001"
    environment:
      - MODEL_PATH=/models/AgentCPM-GVI
    volumes:
      - agentcpm-models:/models
    networks:
      - galaxy-network
    restart: unless-stopped
    profiles:
      - full
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

networks:
  galaxy-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  # Neo4j
  neo4j-data:
  neo4j-logs:
  neo4j-import:
  neo4j-plugins:
  
  # Qdrant
  qdrant-storage:
  qdrant-snapshots:
  
  # MinIO
  minio-data:
  
  # MongoDB
  mongo-data:
  
  # Galaxy
  galaxy-data:
  galaxy-logs:

  # Others
  oneapi-data:
  ollama-models:
  memos-data:
  redis-data:
  agentcpm-models:

  # Agentic OS
  nats-data:
  temporal-db-data:
