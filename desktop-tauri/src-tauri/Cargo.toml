[package]
name = "galaxy-overlay"
version = "2.0.0"
description = "Galaxy 三态桌面覆盖层 — Tauri 壳（替代 Electron，系统 WebView、不背 Chromium）"
authors = ["Galaxy"]
edition = "2021"
rust-version = "1.77"

# 产物名固定为 galaxy-overlay（.exe）——unified_launcher.start_tauri 据此查找二进制。
[[bin]]
name = "galaxy-overlay"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api：让透明窗口在 macOS 上也可用（Windows 不需要该 feature，但带着无害）。
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 仅访问本机网关(http)，用 rustls 避免依赖系统 OpenSSL/native-tls。
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# 复刻 Electron main.js 的 IPC HTTP 接收端（托盘/后端 POST /ipc/*）。
tiny_http = "0.12"
# 面板数据轮询 + 屏幕采集循环用到的定时器（与 Tauri 内置 tokio 运行时兼容）。
tokio = { version = "1", features = ["time"] }
# 第一态原生连续屏幕采集（跨平台截屏；Windows 走 Win32，免 getDisplayMedia 选择器）。
# 用 xcap 自带 re-export 的 image（pub use image），避免 image 版本冲突；它默认带 JPEG 编码。
xcap = "0.0"
base64 = "0.22"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
