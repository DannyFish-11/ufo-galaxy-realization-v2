# Galaxy – Nginx Rate-Limiting Configuration (PR-G5)
#
# Place this file at deployment/nginx/ratelimit.conf and mount it into
# the nginx-ratelimit container (see deployment/docker-compose.rate-limiting.yml).
#
# Rate-limiting directives
# ------------------------
# The limit_req_zone and limit_conn_zone directives must be placed in the
# nginx.conf http{} block (they cannot be defined inside a server{} block).
# The corresponding limit_req / limit_conn directives in the location blocks
# below are commented out to keep this file self-contained as a drop-in
# conf.d snippet.
#
# To enable rate limiting:
#   1. Add the zone definitions to the http{} block in your nginx.conf:
#        limit_req_zone $binary_remote_addr zone=galaxy_api:10m rate=100r/s;
#        limit_req_zone $binary_remote_addr zone=resilience_api:5m rate=10r/s;
#        limit_conn_zone $binary_remote_addr zone=galaxy_conn:10m;
#        limit_req_status 429;
#   2. Uncomment the limit_req / limit_conn lines in this file.
#   3. Reload nginx: nginx -s reload

server {
    listen 9080;
    server_name _;

    # Global connection limit per IP
    # limit_conn galaxy_conn 20;

    # Proxy to the Galaxy application
    location / {
        # Rate limit: allow 100 req/s with burst of 200, no delay for burst
        # limit_req zone=galaxy_api burst=200 nodelay;

        proxy_pass         http://galaxy:9000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    # Resilience metrics endpoint: stricter rate limit
    location /api/v1/resilience/ {
        # limit_req zone=resilience_api burst=20 nodelay;

        proxy_pass         http://galaxy:9000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # Health check bypass (no rate limit)
    location /health/ {
        proxy_pass         http://galaxy:9000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    # Return 429 when limit_req rejects (requires limit_req_status in http{})
    error_page 503 @rate_limited;
    location @rate_limited {
        default_type application/json;
        return 429 '{"error": "too_many_requests", "retry_after": 1}';
    }
}
